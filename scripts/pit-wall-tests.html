<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pit Wall regression tests</title></head>
<body>
  <h1>Pit Wall regression tests</h1>
  <pre id="results">Running...</pre>
  <div id="fixture" hidden></div>
  <script type="module">
    import { PitWallConsole, drawDiscovery } from "../games/pit-wall.js";

    const results = document.querySelector("#results");
    const root = document.querySelector("#fixture");
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };

    try {
      const actualRandom = Math.random;
      try {
        for (const [postGrandPrix, expected] of [
          [false, { blue: 4500, green: 4500, purple: 800, gold: 200 }],
          [true, { blue: 0, green: 9000, purple: 800, gold: 200 }],
        ]) {
          const counts = { blue: 0, green: 0, purple: 0, gold: 0 };
          for (let i = 0; i < 10000; i += 1) {
            let call = 0;
            Math.random = () => call++ === 0 ? i / 10000 : .5;
            counts[drawDiscovery(postGrandPrix).rarity] += 1;
          }
          assert(Object.keys(counts).every((rarity) => counts[rarity] === expected[rarity]),
            `Rarity thresholds do not match the ${postGrandPrix ? "post" : "pre"}-Grand Prix distribution`);
        }
        Math.random = () => .999999;
        const allGold = [];
        for (let i = 0; i < 3; i += 1) allGold.push(drawDiscovery(false, allGold));
        assert(new Set(allGold.map((item) => item.id)).size === 3,
          "Three gold rolls must still produce distinct cards");
      } finally {
        Math.random = actualRandom;
      }

      const game = new PitWallConsole(root);
      game.mount();
      const toggle = root.querySelector('[data-action="toggle-command"]');
      const commandBody = root.querySelector("#pit-wall-command-content");
      assert(toggle.getAttribute("aria-expanded") === "false" && commandBody.inert,
        "Command Centre must start collapsed");
      toggle.click();
      assert(toggle.getAttribute("aria-expanded") === "true" && !commandBody.inert,
        "Command Centre must expand");
      toggle.click();
      assert(toggle.getAttribute("aria-expanded") === "false" && commandBody.inert,
        "Command Centre must collapse again");
      root.querySelector('[data-action="new-game"]').click();

      const cards = [...root.querySelectorAll("[data-driver-index]")];
      assert(cards.length === 3, "New Game must present three drivers");
      assert(new Set(cards.map((card) => card.querySelector(".pit-wall-driver-name").textContent)).size === 3,
        "Draft candidates must be distinct");
      assert(cards.every((card) => card.querySelector(".pit-wall-driver-portrait")
        && card.querySelectorAll(".pit-wall-driver-traits").length === 2
        && card.querySelector(".pit-wall-driver-traits").textContent.split(" • ").length === 2),
      "Each candidate must have a portrait, two strengths and a weakness");

      const driverPanel = root.querySelector(".pit-wall-panel-left");
      cards[0].click();
      assert(driverPanel.textContent.includes(cards[0].querySelector(".pit-wall-driver-name").textContent)
        && cards[0].querySelector(".pit-wall-card-choice").getAttribute("aria-pressed") === "true"
        && !cards[0].querySelector(".pit-wall-confirm-button").hidden,
      "Choosing a driver must update the Driver panel and show confirmation");
      cards[1].click();
      assert(driverPanel.textContent.includes(cards[1].querySelector(".pit-wall-driver-name").textContent)
        && cards[0].querySelector(".pit-wall-card-choice").getAttribute("aria-pressed") === "false"
        && cards[0].querySelector(".pit-wall-confirm-button").hidden
        && cards[1].querySelector(".pit-wall-card-choice").getAttribute("aria-pressed") === "true"
        && !cards[1].querySelector(".pit-wall-confirm-button").hidden,
      "Choosing another driver must move the selection and confirmation");
      const selectedDriver = cards[1].querySelector(".pit-wall-driver-name").textContent;
      cards[1].querySelector(".pit-wall-confirm-button").click();
      assert(driverPanel.textContent.includes(selectedDriver) && driverPanel.textContent.includes("Driver Confirmed")
        && root.querySelector(".pit-wall-info-value").textContent === "Driver Confirmed"
        && root.querySelector("#pit-wall-draft-title").textContent === "Team Draft",
      "Confirming a driver must lock the driver and open Team Draft");
      const teamCards = [...root.querySelectorAll("[data-team-index]")];
      assert(teamCards.length === 3
        && new Set(teamCards.map((card) => card.querySelector(".pit-wall-driver-name").textContent)).size === 3
        && teamCards.every((card) => card.querySelectorAll(".pit-wall-driver-traits").length === 3),
      "Team Draft must show three distinct teams with a bonus, weakness and description");
      teamCards[0].click();
      teamCards[1].click();
      assert(teamCards[0].querySelector(".pit-wall-confirm-button").hidden
        && teamCards[0].querySelector(".pit-wall-card-choice").getAttribute("aria-pressed") === "false"
        && !teamCards[1].querySelector(".pit-wall-confirm-button").hidden
        && teamCards[1].querySelector(".pit-wall-card-choice").getAttribute("aria-pressed") === "true",
      "Changing team selection must move the confirmation");
      const selectedTeam = teamCards[1].querySelector(".pit-wall-driver-name").textContent;
      teamCards[1].querySelector(".pit-wall-confirm-button").click();
      assert(driverPanel.textContent.includes(selectedDriver) && driverPanel.textContent.includes(selectedTeam)
        && driverPanel.textContent.includes("Driver Traits") && driverPanel.textContent.includes("Team Traits")
        && driverPanel.textContent.includes("Ready For Season")
        && root.querySelector(".pit-wall-info-value").textContent === "Ready For Season"
        && root.querySelector("#pit-wall-draft-title").textContent === "2027 Season Setup"
        && !root.querySelector("[data-team-index]"),
      "Confirming a team must lock both selections and open season setup");

      const confirmSeason = root.querySelector('[data-action="confirm-season"]');
      assert(root.querySelector('[data-weekend="bahrain"]').getAttribute("aria-pressed") === "true"
        && root.querySelector('[data-weekend="saudi-arabia"]').getAttribute("aria-pressed") === "true"
        && root.querySelector("[data-season-count]").textContent === "24"
        && root.querySelector("[data-season-length]").textContent === "24 Races Selected",
      "All 24 races must be selected by default");
      root.querySelector('[data-action="clear-races"]').click();
      assert(confirmSeason.disabled && root.querySelector("[data-season-count]").textContent === "0"
        && root.querySelector("[data-season-warning]").textContent.includes("at least one race"),
      "An empty season must not be confirmable");
      root.querySelector('[data-weekend="saudi-arabia"]').click();
      assert(root.querySelector("[data-season-names]").textContent === "Saudi Arabia"
        && root.querySelector("[data-season-length]").textContent === "1 Race Selected",
      "Selecting one race must update the season summary");
      root.querySelector('[data-weekend="bahrain"]').click();
      assert(root.querySelector("[data-season-count]").textContent === "2",
        "Two races must be selectable");
      root.querySelector('[data-action="next-calendar"]').click();
      assert(root.querySelector('[data-weekend="canada"]') && root.querySelector("[data-calendar-page]").textContent === "Calendar 2/4",
        "The calendar must expose later rounds without scrolling");
      root.querySelector('[data-action="select-all-races"]').click();
      assert(root.querySelector("[data-season-count]").textContent === "24",
        "Select All must restore the full season");
      confirmSeason.click();
      assert(root.querySelector("#pit-wall-weekend-title").textContent === "Bahrain Grand Prix"
        && driverPanel.textContent.includes(selectedDriver) && driverPanel.textContent.includes(selectedTeam)
        && driverPanel.textContent.includes("Race Weekend Ready")
        && root.querySelector(".pit-wall-weekend-banner").textContent.includes("12-14 March 2027")
        && root.querySelector(".pit-wall-weekend-banner").textContent.includes("Sunny")
        && root.querySelector(".pit-wall-weekend-banner").textContent.includes("Forecast: Stable")
        && root.querySelector(".pit-wall-panel-right").textContent.includes("5.412 km")
        && root.querySelector(".pit-wall-panel-right").textContent.includes("57 Laps")
        && root.querySelector(".pit-wall-panel-right").textContent.includes("Sprint Weekend"),
      "A confirmed season must load the first selected weekend");
      await root.querySelector(".pit-wall-circuit img").decode();

      const bahrainWeekend = game.weekendState.weekend;
      const trackerLabels = () => [...root.querySelectorAll(".pit-wall-session-step")]
        .map((step) => step.getAttribute("aria-label"));
      assert(trackerLabels().join("|") === [
        "Practice 1: Current", "Sprint Qualifying: Pending", "Sprint Race: Pending",
        "Qualifying: Pending", "Grand Prix: Pending",
      ].join("|"), "Bahrain must start with the correct sprint session order");
      const started = performance.now();
      root.querySelector('[data-action="start-session"]').click();
      await new Promise((resolve) => setTimeout(resolve, 350));
      assert(root.querySelector(".pit-wall-session-running").textContent.includes("Practice 1 Running")
        && root.querySelector(".pit-wall-session-panel progress").value > 0
        && root.querySelector(".pit-wall-session-panel progress").value < 5000,
      "Starting a session must show a progressing running state");
      while (game.weekendState.phase === "running" && performance.now() - started < 6500) {
        await new Promise((resolve) => setTimeout(resolve, 100));
      }
      const elapsed = performance.now() - started;
      assert(elapsed >= 4000 && elapsed <= 6200 && game.weekendState.phase === "discovery"
        && root.querySelector(".pit-wall-discovery-heading").textContent.includes("Session Complete")
        && root.querySelector(".pit-wall-discovery-heading").textContent.includes("Engineering Discovery Available"),
      "A natural session must last approximately five seconds and offer a discovery");
      const firstOptions = [...root.querySelectorAll("[data-discovery-index]")];
      assert(firstOptions.length === 3 && new Set(game.weekendState.options.map((item) => item.id)).size === 3,
        "A completed session must offer three distinct discoveries");
      const firstCategory = game.weekendState.options[0].category;
      const firstReward = game.weekendState.options[0];
      firstOptions[0].click();
      firstOptions[0].click();
      assert(game.permanentUpgrades.length + game.weekendDiscoveries.length === 1
        && driverPanel.textContent.includes(firstReward.name)
        && root.querySelector(".pit-wall-session-notice").textContent.includes(firstReward.name)
        && trackerLabels()[0] === "Practice 1: Completed"
        && trackerLabels()[1] === "Sprint Qualifying: Current",
      "One discovery must be stored once, shown in the profile, and advance the session");

      const discoveryRandom = Math.random;
      let fakeNow = 0;
      try {
        Object.defineProperty(performance, "now", { configurable: true, value: () => fakeNow });
        for (let i = 1; i < 5; i += 1) {
          Math.random = () => i === 4 || (firstCategory === "permanent" && i === 1) ? .1 : .5;
          root.querySelector('[data-action="start-session"]').click();
          fakeNow += 5100;
          await new Promise((resolve) => setTimeout(resolve, 150));
          assert(game.weekendState.phase === "discovery" && game.weekendState.options.length === 3
            && new Set(game.weekendState.options.map((item) => item.id)).size === 3
            && (i !== 4 || game.weekendState.options.every((item) => item.rarity !== "blue")),
          "Each completed session must offer three distinct discoveries");
          const otherCategory = game.weekendState.options.findIndex((item) => item.category !== firstCategory);
          root.querySelectorAll("[data-discovery-index]")[Math.max(otherCategory, 0)].click();
        }
      } finally {
        delete performance.now;
        Math.random = discoveryRandom;
      }
      assert(game.weekendState.phase === "complete"
        && root.querySelector('[data-action="next-round"]').textContent.includes("Proceed To Next Round")
        && trackerLabels().every((label) => label.endsWith(": Completed"))
        && game.permanentUpgrades.length > 0 && game.weekendDiscoveries.length === 0
        && game.roundsCompleted === 1
        && driverPanel.textContent.includes("Permanent Upgrades")
        && driverPanel.textContent.includes("Weekend Discoveries"),
      "Five completed sessions must finish the round and expire weekend discoveries");

      const drawAt = (roll, selection) => {
        let call = 0;
        const saved = Math.random;
        try {
          Math.random = () => call++ === 0 ? roll : selection;
          return drawDiscovery(false);
        } finally {
          Math.random = saved;
        }
      };
      const research = drawAt(.99, 0);
      const review = drawAt(.99, .4);
      const legacy = drawAt(.99, .9);
      assert(research.id === "research-charter" && review.id === "design-review" && legacy.id === "legacy-lab",
        "Gold rewards must provide the three intended run-defining choices");
      const purple = drawAt(.95, 0);
      const green = drawAt(.5, 0);
      assert(purple.amount === 3 && green.amount === 1 && purple.stat === green.stat,
        "Purple breakthroughs must provide three times the corresponding green upgrade");
      game.renderWeekend(bahrainWeekend);
      game.permanentUpgrades = [research, research, review, legacy];
      let legendaryTime = 0;
      try {
        Object.defineProperty(performance, "now", { configurable: true, value: () => legendaryTime });
        Math.random = () => .1;
        root.querySelector('[data-action="start-session"]').click();
        legendaryTime = 5100;
        await new Promise((resolve) => setTimeout(resolve, 150));
        assert(game.weekendState.rerollsRemaining === 2 && game.weekendState.replacementsRemaining === 1,
          "Stacked gold upgrades must grant future-session reroll choices");
        root.querySelector('[data-action="replace-discovery"]').click();
        assert(root.querySelector('[data-action="replace-discovery"]').getAttribute("aria-pressed") === "true",
          "Single-card reroll mode must be clearly selected");
        root.querySelector('[data-discovery-index="1"]').click();
        assert(game.weekendState.replacementsRemaining === 0
          && new Set(game.weekendState.options.map((item) => item.id)).size === 3
          && game.weekendState.sessionIndex === 0,
        "A single-card reroll must consume its charge without selecting a reward");
        game.weekendState.sessionResults[4] = "completed";
        root.querySelector('[data-action="reroll-discoveries"]').click();
        assert(game.weekendState.rerollsRemaining === 1
          && game.weekendState.options.every((item) => item.rarity !== "blue"),
        "A full reroll after the Grand Prix must consume its charge and exclude blue");
        assert(root.querySelector('[data-discovery-index="0"]').textContent.includes("+2 ")
          && root.querySelector('[data-discovery-index="0"]').textContent.includes("Green · Permanent"),
          "Green cards must preview their boosted effect");
        root.querySelector('[data-discovery-index="0"]').click();
        const boosted = game.permanentUpgrades[game.permanentUpgrades.length - 1];
        assert(boosted.rarity === "green" && boosted.amount === 2
          && boosted.effect === `+2 ${boosted.stat}`,
        "Legacy Lab must double the effect stored for a future green selection");
      } finally {
        delete performance.now;
        Math.random = actualRandom;
      }

      const permanentCount = game.permanentUpgrades.length;
      game.renderWeekend(bahrainWeekend);
      assert(game.permanentUpgrades.length === permanentCount && game.weekendDiscoveries.length === 0,
        "A new weekend must retain permanent upgrades and clear weekend discoveries");
      root.querySelector('[data-action="start-session"]').click();
      root.querySelector('[data-action="skip-session"]').click();
      assert(game.sessionTimer === null && game.weekendState.sessionResults[0] === "skipped"
        && game.weekendState.sessionIndex === 1 && game.weekendDiscoveries.length === 0
        && game.permanentUpgrades.length === permanentCount,
      "Skipping a running session must cancel its timer and award nothing");
      for (let i = 1; i < 5; i += 1) root.querySelector('[data-action="skip-session"]').click();
      assert(game.weekendState.phase === "complete"
        && game.weekendState.sessionResults.every((result) => result === "skipped")
        && game.permanentUpgrades.length === permanentCount,
      "Skipping every session must finish the weekend without rewards");
      game.renderWeekend(bahrainWeekend);
      root.querySelector('[data-action="start-session"]').click();
      game.startDraft();
      assert(game.sessionTimer === null && game.weekendState === null
        && game.permanentUpgrades.length === 0 && game.weekendDiscoveries.length === 0,
      "Starting a new game during a session must cancel its timer and clear upgrades");

      const startSeason = () => {
        game.startDraft();
        root.querySelector("[data-driver-index]").click();
        root.querySelector("[data-driver-index] .pit-wall-confirm-button").click();
        root.querySelector("[data-team-index]").click();
        root.querySelector("[data-team-index] .pit-wall-confirm-button").click();
      };
      startSeason();
      root.querySelector('[data-action="confirm-season"]').click();
      const expectedRounds = [
        "bahrain", "saudi-arabia", "australia", "japan", "china", "miami", "canada", "monaco",
        "portugal", "great-britain", "austria", "belgium", "hungary", "italy", "spain", "azerbaijan",
        "turkiye", "singapore", "united-states", "mexico", "brazil", "las-vegas", "qatar", "abu-dhabi",
      ];
      const sprintRounds = new Set([1, 3, 4, 7, 8, 10, 14, 21, 23, 24]);
      let seasonTime = 0;
      try {
        Object.defineProperty(performance, "now", { configurable: true, value: () => seasonTime });
        for (let round = 1; round <= 24; round += 1) {
          const weekend = game.weekendState.weekend;
          assert(weekend.id === expectedRounds[round - 1] && weekend.round === round
            && Boolean(weekend.sprint) === sprintRounds.has(round),
          `Round ${round} must follow the 2027 calendar and sprint format`);
          assert(root.querySelector(".pit-wall-championship").textContent.includes(`Round ${round} / 24`)
            && root.querySelector(".pit-wall-championship progress").value === round - 1
            && root.querySelector(".pit-wall-panel-left").textContent.includes(`Rounds Completed: ${round - 1}`)
            && trackerLabels().length === 5
            && trackerLabels()[1].startsWith(weekend.sprint ? "Sprint Qualifying" : "Practice 2"),
          `Round ${round} must show current championship progress and the correct session format`);
          if (round > 2) {
            const placeholder = root.querySelector(".pit-wall-circuit-placeholder");
            assert(placeholder && !root.querySelector(".pit-wall-circuit img")
              && placeholder.textContent.includes("Track Layout Coming Soon")
              && placeholder.textContent.includes(weekend.track) && placeholder.textContent.includes(weekend.country)
              && placeholder.textContent.includes(`Round ${round}`) && placeholder.textContent.includes(weekend.format)
              && placeholder.textContent.includes(`Circuit Length: ${weekend.circuitLength}`)
              && placeholder.textContent.includes("Lap Count: TBC"),
            `Round ${round} must show the correct track placeholder`);
          }
          if (round <= 2) {
            for (const roll of round === 1 ? [.1, .5] : [.95, .99]) {
              Math.random = () => roll;
              root.querySelector('[data-action="start-session"]').click();
              seasonTime += 5100;
              await new Promise((resolve) => setTimeout(resolve, 150));
              root.querySelector('[data-discovery-index="0"]').click();
            }
          }
          if (round === 24) {
            for (let i = 0; i < 4; i += 1) root.querySelector('[data-action="skip-session"]').click();
            Math.random = () => .95;
            root.querySelector('[data-action="start-session"]').click();
            seasonTime += 5100;
            await new Promise((resolve) => setTimeout(resolve, 150));
            assert(game.weekendState.options.every((item) => item.rarity !== "blue")
              && game.roundsCompleted === 23,
            "The final Grand Prix must offer post-race rewards before completing the season");
            root.querySelector('[data-discovery-index="0"]').click();
          }
          while (game.weekendState.phase === "ready") root.querySelector('[data-action="skip-session"]').click();
          assert(game.roundsCompleted === round && game.weekendDiscoveries.length === 0,
            `Completing round ${round} must count once and clear weekend discoveries`);
          if (round === 2) {
            const progressText = driverPanel.querySelector(".pit-wall-season-progress").textContent;
            assert(progressText.includes("Rounds Completed: 2") && progressText.includes("Permanent Upgrades: 3")
              && progressText.includes("Rare Breakthroughs: 1") && progressText.includes("Legendary Discoveries: 1"),
            "Season progress must count permanent, rare and legendary rewards correctly");
          }
          if (round < 24) {
            const next = root.querySelector('[data-action="next-round"]');
            assert(next && !root.querySelector("#pit-wall-season-finish-title"),
              `Round ${round} must offer progression`);
            next.click();
            next.click();
            assert(game.currentRoundIndex === round && game.weekendState.weekend.id === expectedRounds[round]
              && (round !== 1 || game.permanentUpgrades.length === 1),
            `Round ${round + 1} must load once and retain permanent upgrades`);
          } else {
            const summary = root.querySelector(".pit-wall-season-finish");
            assert(summary && summary.textContent.includes("Season Complete")
              && summary.textContent.includes("Total Permanent Upgrades")
              && summary.textContent.includes("Total Rare Breakthroughs")
              && summary.textContent.includes("Total Legendary Discoveries")
              && summary.textContent.includes("Weekend Wins")
              && summary.textContent.includes("Championship Position")
              && [...summary.querySelectorAll("dd")].map((item) => item.textContent).join("|")
                === "4|2|1|Not available yet|Not available yet"
              && game.permanentUpgrades.length === 4
              && game.permanentUpgrades.filter((item) => item.rarity === "purple").length === 2
              && game.permanentUpgrades.filter((item) => item.rarity === "gold").length === 1
              && !root.querySelector('[data-action="next-round"]'),
            "The 24th round must finish the season with persistent reward totals");
          }
        }
      } finally {
        delete performance.now;
        Math.random = actualRandom;
      }

      startSeason();
      root.querySelector('[data-action="clear-races"]').click();
      root.querySelector('[data-weekend="bahrain"]').click();
      for (let i = 0; i < 3; i += 1) root.querySelector('[data-action="next-calendar"]').click();
      root.querySelector('[data-weekend="abu-dhabi"]').click();
      root.querySelector('[data-action="confirm-season"]').click();
      for (let i = 0; i < 5; i += 1) root.querySelector('[data-action="skip-session"]').click();
      root.querySelector('[data-action="next-round"]').click();
      assert(game.weekendState.weekend.round === 24
        && root.querySelector(".pit-wall-championship").textContent.includes("Round 24 / 24")
        && root.querySelector(".pit-wall-championship").textContent.includes("Selected: 2 / 2"),
      "A customized season must advance to the next selected round");
      for (let i = 0; i < 5; i += 1) root.querySelector('[data-action="skip-session"]').click();
      assert(root.querySelector(".pit-wall-season-finish").textContent.includes("Rounds Completed: 2 / 2"),
        "A customized season must finish after its last selected round");

      const originalRandom = Math.random;
      let seed = 12345;
      const names = new Set();
      const teamNames = new Set();
      try {
        Math.random = () => {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        };
        for (let i = 0; i < 100; i += 1) {
          game.startDraft();
          const shortlist = [...root.querySelectorAll("[data-driver-index]")];
          const shortlistNames = shortlist.map((card) => card.querySelector(".pit-wall-driver-name").textContent);
          assert(shortlist.length === 3 && new Set(shortlistNames).size === 3,
            "Every draft must contain three distinct drivers");
          shortlistNames.forEach((name) => names.add(name));
          shortlist[0].click();
          shortlist[0].querySelector(".pit-wall-confirm-button").click();
          const teams = [...root.querySelectorAll("[data-team-index]")];
          const namesInDraft = teams.map((card) => card.querySelector(".pit-wall-driver-name").textContent);
          assert(teams.length === 3 && new Set(namesInDraft).size === 3,
            "Every team draft must contain three distinct teams");
          namesInDraft.forEach((name) => teamNames.add(name));
        }
      } finally {
        Math.random = originalRandom;
      }
      assert(names.size === 10, "The draft must draw from a pool of ten drivers");
      assert(teamNames.size === 5, "The team draft must draw from a pool of five teams");
      game.startDraft();
      assert(!driverPanel.querySelector(".pit-wall-driver-profile")
        && game.permanentUpgrades.length === 0 && game.weekendDiscoveries.length === 0
        && root.querySelector(".pit-wall-info-value").textContent === "Ready"
        && root.querySelector(".pit-wall-panel-right").textContent.includes("Timing Panel"),
      "Starting a draft must clear the previous selections, status and weekend overview");

      const frame = document.createElement("iframe");
      frame.style.cssText = "position:fixed;left:-10000px;top:0;width:568px;height:320px;border:0";
      frame.src = "../index.html";
      await new Promise((resolve, reject) => {
        frame.onload = resolve;
        frame.onerror = () => reject(new Error("Could not load the console layout"));
        document.body.append(frame);
      });
      const doc = frame.contentDocument;
      const frameRoot = doc.querySelector("[data-pit-wall-root]");
      for (let i = 0; i < 100 && !frameRoot.querySelector('[data-action="new-game"]'); i += 1) {
        await new Promise((resolve) => setTimeout(resolve, 50));
      }
      assert(frameRoot.querySelector('[data-action="new-game"]'), "Console did not load");
      doc.querySelector('[data-room="gamesroom"]').dispatchEvent(
        new frame.contentWindow.MouseEvent("click", { bubbles: true, cancelable: true }));
      doc.querySelector('a[href="#games-pit-wall"]').click();
      const originalUrl = frame.contentWindow.location.href;
      const layoutGame = new PitWallConsole(frameRoot);
      layoutGame.mount();
      frameRoot.querySelector('[data-action="new-game"]').click();
      frameRoot.querySelector('[data-action="toggle-command"]').click();
      await new Promise((resolve) => setTimeout(resolve, 250));

      const within = (inner, outer) => {
        const a = inner.getBoundingClientRect();
        const b = outer.getBoundingClientRect();
        return a.left >= b.left - 1 && a.right <= b.right + 1
          && a.top >= b.top - 1 && a.bottom <= b.bottom + 1;
      };
      const assertCircuitCentred = (image, label) => {
        const canvas = doc.createElement("canvas");
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        const context = canvas.getContext("2d");
        context.drawImage(image, 0, 0);
        const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
        let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1;
        let trackPixel;
        for (let y = 0; y < canvas.height; y += 1) {
          for (let x = 0; x < canvas.width; x += 1) {
            const index = (y * canvas.width + x) * 4;
            if (pixels[index + 3] === 0) continue;
            if (!trackPixel && pixels[index + 3] === 255
              && pixels[index] < 60 && pixels[index + 1] < 60 && pixels[index + 2] < 60) {
              trackPixel = [x, y];
            }
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          }
        }
        assert(maxX >= 0, `${label} circuit has no visible pixels`);
        const box = image.getBoundingClientRect();
        const container = image.parentElement.getBoundingClientRect();
        const containerStyle = frame.contentWindow.getComputedStyle(image.parentElement);
        const padding = parseFloat(containerStyle.paddingLeft) + parseFloat(containerStyle.borderLeftWidth);
        assert(containerStyle.backgroundColor === "rgba(0, 0, 0, 0)" && trackPixel,
          `${label} circuit must use a transparent display area`);
        const sample = doc.createElement("canvas");
        sample.width = 1;
        sample.height = 1;
        const sampleContext = sample.getContext("2d");
        sampleContext.filter = frame.contentWindow.getComputedStyle(image).filter;
        sampleContext.drawImage(image, trackPixel[0], trackPixel[1], 1, 1, 0, 0, 1, 1);
        const colour = sampleContext.getImageData(0, 0, 1, 1).data;
        const luminance = (rgb) => {
          const channels = [...rgb].slice(0, 3).map((value) => {
            const c = value / 255;
            return c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4;
          });
          return .2126 * channels[0] + .7152 * channels[1] + .0722 * channels[2];
        };
        const trackLuminance = luminance(colour);
        const navyLuminance = luminance([3, 26, 52]);
        assert((trackLuminance + .05) / (navyLuminance + .05) >= 3 && trackLuminance < .65,
          `${label} circuit must remain legible against navy without becoming bright white`);
        const scale = Math.min(box.width / canvas.width, box.height / canvas.height);
        const x = box.left + (box.width - canvas.width * scale) / 2;
        const y = box.top + (box.height - canvas.height * scale) / 2;
        const left = x + minX * scale - container.left;
        const right = container.right - (x + (maxX + 1) * scale);
        const top = y + minY * scale - container.top;
        const bottom = container.bottom - (y + (maxY + 1) * scale);
        assert(Math.abs(left - right) < 1 && Math.abs(top - bottom) < 1,
          `${label} visible circuit is not centred`);
        assert(Math.min(left, right, top, bottom) >= padding - 1
          && Math.abs(Math.min(left, right, top, bottom) - padding) < 1,
        `${label} circuit is clipped or not maximised within its padding`);
      };
      for (const [width, height] of [[568, 320], [844, 390]]) {
        frame.style.width = `${width}px`;
        frame.style.height = `${height}px`;
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const seen = new Set();
        const teamsSeen = new Set();
        const profiles = [];
        let layoutSeed = 12345;
        try {
          Math.random = () => {
            layoutSeed = (layoutSeed * 16807) % 2147483647;
            return (layoutSeed - 1) / 2147483646;
          };
          for (let i = 0; i < 40; i += 1) {
            layoutGame.startDraft();
            const choices = [...frameRoot.querySelectorAll("[data-driver-index]")];
            const main = frameRoot.querySelector(".pit-wall-track-display");
            assert(choices.every((card) => within(card, main))
              && choices.every((card) => Math.abs(card.getBoundingClientRect().top
                - choices[0].getBoundingClientRect().top) < 1),
            `Draft cards do not fit side-by-side at ${width}x${height}`);
            choices.forEach((card) => {
              seen.add(card.querySelector(".pit-wall-driver-name").textContent);
              assert(card.scrollHeight <= card.clientHeight + 1 && card.scrollWidth <= card.clientWidth + 1,
                `Driver card content overflows at ${width}x${height}`);
              card.click();
              assert(within(frameRoot.querySelector(".pit-wall-driver-profile"),
                frameRoot.querySelector(".pit-wall-panel-left .pit-wall-panel-content")),
              `Selected driver overflows at ${width}x${height}`);
              const footer = card.querySelector(".pit-wall-card-footer");
              const selected = footer.querySelector(".pit-wall-driver-select").getBoundingClientRect();
              const confirm = footer.querySelector(".pit-wall-confirm-button").getBoundingClientRect();
              assert(Math.abs(selected.top + selected.height / 2 - confirm.top - confirm.height / 2) < 1
                && confirm.right <= footer.getBoundingClientRect().right + 1,
              `Confirmation is not on the card footer at ${width}x${height}`);
            });
            choices[0].click();
            choices[0].querySelector(".pit-wall-confirm-button").click();
            const teams = [...frameRoot.querySelectorAll("[data-team-index]")];
            assert(teams.every((card) => within(card, main))
              && teams.every((card) => Math.abs(card.getBoundingClientRect().top
                - teams[0].getBoundingClientRect().top) < 1),
            `Team cards do not fit side-by-side at ${width}x${height}`);
            teams.forEach((card) => {
              teamsSeen.add(card.querySelector(".pit-wall-driver-name").textContent);
              assert(card.scrollHeight <= card.clientHeight + 1 && card.scrollWidth <= card.clientWidth + 1,
                `Team card content overflows at ${width}x${height}`);
              card.click();
            });
            teams[0].click();
            teams[0].querySelector(".pit-wall-confirm-button").click();
            profiles.push([layoutGame.driver, layoutGame.team]);
            assert(within(frameRoot.querySelector(".pit-wall-driver-profile"),
              frameRoot.querySelector(".pit-wall-panel-left .pit-wall-panel-content")),
            `Confirmed driver and team overflow at ${width}x${height}`);
          }
        } finally {
          Math.random = originalRandom;
        }
        assert(seen.size === 10, "Layout checks must cover all ten drivers");
        assert(teamsSeen.size === 5, "Layout checks must cover all five teams");
        const main = frameRoot.querySelector(".pit-wall-track-display");
        const season = frameRoot.querySelector(".pit-wall-season");
        const seasonConfirm = frameRoot.querySelector('[data-action="confirm-season"]');
        for (let page = 0; page < 4; page += 1) {
          const calendarCards = [...season.querySelectorAll("[data-weekend]")];
          assert(within(season, main) && within(seasonConfirm, main)
            && season.scrollHeight <= season.clientHeight + 1
            && season.scrollWidth <= season.clientWidth + 1
            && calendarCards.length === 6 && calendarCards.every((card, index) =>
              within(card, main) && card.scrollHeight <= card.clientHeight + 1
              && card.scrollWidth <= card.clientWidth + 1
              && card.dataset.weekend === expectedRounds[page * 6 + index]
              && card.querySelector(".pit-wall-season-round").textContent.includes("Sprint")
                === sprintRounds.has(page * 6 + index + 1)),
          `Calendar page ${page + 1} overflows at ${width}x${height}`);
          if (page < 3) frameRoot.querySelector('[data-action="next-calendar"]').click();
        }
        for (let page = 0; page < 3; page += 1) frameRoot.querySelector('[data-action="previous-calendar"]').click();
        const seasonFooter = season.querySelector(".pit-wall-season-footer").getBoundingClientRect();
        const confirmBounds = seasonConfirm.getBoundingClientRect();
        assert(Math.abs(confirmBounds.right - seasonFooter.right) < 1
          && Math.abs(confirmBounds.bottom - season.getBoundingClientRect().bottom) < 1,
          `Confirm Season is not at the bottom-right at ${width}x${height}`);
        seasonConfirm.click();
        let circuit = frameRoot.querySelector(".pit-wall-circuit img");
        await circuit.decode();
        const imageBounds = circuit.getBoundingClientRect();
        const mainBounds = main.getBoundingClientRect();
        assert(frameRoot.querySelector("#pit-wall-weekend-title").textContent === "Bahrain Grand Prix"
          && circuit.naturalWidth > 0 && within(circuit, main)
          && imageBounds.width * imageBounds.height >= mainBounds.width * mainBounds.height * .35
          && frame.contentWindow.getComputedStyle(circuit).objectFit === "contain",
        `Bahrain circuit is not displayed correctly at ${width}x${height}`);
        assertCircuitCentred(circuit, `Bahrain at ${width}x${height}`);
        assert(within(frameRoot.querySelector(".pit-wall-weekend-banner"), main)
          && within(frameRoot.querySelector(".pit-wall-weekend-overview"),
            frameRoot.querySelector(".pit-wall-panel-right .pit-wall-panel-content")),
        `Weekend details overflow at ${width}x${height}`);

        layoutGame.startDraft();
        frameRoot.querySelector("[data-driver-index]").click();
        frameRoot.querySelector("[data-driver-index] .pit-wall-confirm-button").click();
        frameRoot.querySelector("[data-team-index]").click();
        frameRoot.querySelector("[data-team-index] .pit-wall-confirm-button").click();
        frameRoot.querySelector('[data-weekend="bahrain"]').click();
        frameRoot.querySelector('[data-action="confirm-season"]').click();
        circuit = frameRoot.querySelector(".pit-wall-circuit img");
        await circuit.decode();
        assert(frameRoot.querySelector("#pit-wall-weekend-title").textContent === "Saudi Arabian Grand Prix"
          && frameRoot.querySelector(".pit-wall-panel-right").textContent.includes("6.174 km")
          && frameRoot.querySelector(".pit-wall-panel-right").textContent.includes("50 Laps")
          && frameRoot.querySelector(".pit-wall-panel-right").textContent.includes("Standard Weekend")
          && [...frameRoot.querySelectorAll(".pit-wall-session-step")].map((step) => step.textContent.trim().slice(2)).join("|")
            === "Practice 1|Practice 2|Practice 3|Qualifying|Grand Prix"
          && circuit.naturalWidth > 0 && within(circuit, main),
        `Saudi Arabia must load when it is the first selected weekend at ${width}x${height}`);
        assertCircuitCentred(circuit, `Saudi Arabia at ${width}x${height}`);
        const permanentExamples = [
          { name: "Wind Tunnel Upgrade", effect: "+1 Aero", category: "permanent", rarity: "green" },
          { name: "Brake Cooling", effect: "+1 Reliability", category: "permanent", rarity: "green" },
          { name: "Battery Optimisation", effect: "+1 Energy Recovery", category: "permanent", rarity: "green" },
          { name: "Suspension Development", effect: "+1 Handling", category: "permanent", rarity: "green" },
          { name: "Pit Crew Training", effect: "+1 Pit Efficiency", category: "permanent", rarity: "green" },
        ];
        const weekendExamples = [
          { name: "Tyre Insight", effect: "+10% Tyre Life", category: "weekend", rarity: "blue" },
          { name: "Track Evolution Notes", effect: "+0.15 Pace", category: "weekend", rarity: "blue" },
          { name: "Braking Reference Data", effect: "+20% Corner Entry", category: "weekend", rarity: "blue" },
          { name: "Fuel Mapping Discovery", effect: "+15% Fuel Efficiency", category: "weekend", rarity: "blue" },
          { name: "Overtaking Analysis", effect: "+20% Racecraft", category: "weekend", rarity: "blue" },
        ];
        const originalDriver = layoutGame.driver;
        const originalTeam = layoutGame.team;
        const layoutDrivers = [...new Map(profiles.map(([driver]) => [driver.name, driver])).values()];
        const layoutTeams = [...new Map(profiles.map(([, team]) => [team.name, team])).values()];
        for (const [driver, team] of layoutDrivers.flatMap((driver) =>
          layoutTeams.map((team) => [driver, team]))) {
          layoutGame.driver = driver;
          layoutGame.team = team;
          for (const [permanent, temporary] of [
            [permanentExamples, []], [[], weekendExamples],
            [permanentExamples.slice(2), weekendExamples.slice(2)],
            [[research, review, legacy, purple, { name: "Handling Breakthrough" }], []],
          ]) {
            layoutGame.permanentUpgrades = permanent;
            layoutGame.weekendDiscoveries = temporary;
            layoutGame.renderProfile("Race Weekend Complete");
            const namesOnPages = new Set();
            layoutGame.profileUpgradePage = 0;
            layoutGame.renderProfile("Race Weekend Complete");
            while (true) {
              const profile = frameRoot.querySelector(".pit-wall-driver-profile");
              const profilePanel = frameRoot.querySelector(".pit-wall-panel-left .pit-wall-panel-content");
              assert(within(profile, profilePanel) && profilePanel.scrollHeight <= profilePanel.clientHeight + 1,
                `Upgrade page overflows for ${driver.name} and ${team.name} at ${width}x${height}`);
              [...permanent, ...temporary].forEach((item) => {
                if (profile.textContent.includes(item.name)) namesOnPages.add(item.name);
              });
              const nextPage = frameRoot.querySelector('[data-action="next-upgrades"]');
              if (!nextPage || nextPage.disabled) break;
              nextPage.click();
            }
            assert([...permanent, ...temporary].every((item) => namesOnPages.has(item.name)),
              `All upgrades must be accessible for ${driver.name} and ${team.name} at ${width}x${height}`);
          }
        }
        const allUpgradeNames = [
          ...permanentExamples, research, review, legacy, purple,
          { name: "Durability Breakthrough", rarity: "purple" },
          { name: "Handling Breakthrough", rarity: "purple" },
        ];
        layoutGame.permanentUpgrades = Array.from({ length: 120 }, (_, index) =>
          allUpgradeNames[index % allUpgradeNames.length]);
        layoutGame.weekendDiscoveries = weekendExamples;
        layoutGame.roundsCompleted = 23;
        layoutGame.profileUpgradePage = 0;
        layoutGame.renderProfile("Race Weekend Ready");
        const seenUpgrades = new Set();
        while (true) {
          const profile = frameRoot.querySelector(".pit-wall-driver-profile");
          const profilePanel = frameRoot.querySelector(".pit-wall-panel-left .pit-wall-panel-content");
          assert(within(profile, profilePanel) && profilePanel.scrollHeight <= profilePanel.clientHeight + 1
            && profile.textContent.includes("Permanent Upgrades: 120"),
          `A full season of upgrades must fit at ${width}x${height}`);
          [...allUpgradeNames, ...weekendExamples].forEach((item) => {
            if (profile.textContent.includes(item.name)) seenUpgrades.add(item.name);
          });
          const nextPage = frameRoot.querySelector('[data-action="next-upgrades"]');
          if (!nextPage || nextPage.disabled) break;
          nextPage.click();
        }
        assert([...allUpgradeNames, ...weekendExamples].every((item) => seenUpgrades.has(item.name)),
          `All accumulated upgrades must remain accessible at ${width}x${height}`);
        layoutGame.roundsCompleted = 0;
        layoutGame.driver = originalDriver;
        layoutGame.team = originalTeam;
        layoutGame.weekendState.phase = "discovery";
        layoutGame.weekendState.rerollsRemaining = 120;
        layoutGame.weekendState.replacementsRemaining = 120;
        layoutGame.weekendState.replacementMode = true;
        layoutGame.weekendState.options = [
          review,
          { name: "Durability Breakthrough", effect: "+3 Reliability", rarity: "purple", category: "permanent" },
          weekendExamples[2],
        ];
        layoutGame.renderSession();
        const discoveryPanel = frameRoot.querySelector(".pit-wall-session-panel");
        const discoveryCards = [...frameRoot.querySelectorAll(".pit-wall-discovery-card")];
        const tracker = frameRoot.querySelector(".pit-wall-session-tracker");
        assert(within(discoveryPanel, main) && within(circuit, main)
          && discoveryCards[0].classList.contains("gold") && discoveryCards[0].textContent.includes("Legendary")
          && discoveryCards[1].classList.contains("purple") && discoveryCards[1].textContent.includes("Rare")
          && discoveryCards[2].classList.contains("blue") && discoveryCards[2].textContent.includes("Weekend Only")
          && circuit.getBoundingClientRect().height > 30
          && tracker.scrollHeight <= tracker.clientHeight + 1
          && [...tracker.children].every((step) => step.scrollWidth <= step.clientWidth + 1
            && step.scrollHeight <= step.clientHeight + 1)
          && discoveryCards.every((card) => within(card, discoveryPanel)
            && card.scrollHeight <= card.clientHeight + 1 && card.scrollWidth <= card.clientWidth + 1)
          && discoveryCards.every((card) => Math.abs(card.getBoundingClientRect().top
            - discoveryCards[0].getBoundingClientRect().top) < 1),
        `Discovery cards must fit beside the circuit at ${width}x${height}`);
        layoutGame.weekendState.options = [review, research, legacy];
        layoutGame.renderSession();
        const goldCards = [...frameRoot.querySelectorAll(".pit-wall-discovery-card")];
        assert(within(frameRoot.querySelector(".pit-wall-session-panel"), main)
          && within(circuit, main) && circuit.getBoundingClientRect().height > 30
          && goldCards.every((card) => card.scrollHeight <= card.clientHeight + 1
            && card.scrollWidth <= card.clientWidth + 1),
        `Three legendary cards and reroll controls must fit at ${width}x${height}`);
        layoutGame.weekendState.phase = "ready";
        layoutGame.renderSession();
        frameRoot.querySelector('[data-action="start-session"]').click();
        assert(within(frameRoot.querySelector(".pit-wall-session-panel"), main)
          && within(circuit, main)
          && circuit.getBoundingClientRect().height > 30
          && within(frameRoot.querySelector('[data-action="skip-session"]'), main),
        `Running session controls must fit at ${width}x${height}`);
        frameRoot.querySelector('[data-action="skip-session"]').click();
        for (let i = 1; i < 5; i += 1) frameRoot.querySelector('[data-action="skip-session"]').click();
        assert(layoutGame.weekendState.phase === "complete"
          && layoutGame.weekendState.sessionResults.every((result) => result === "skipped"),
        `All five Saudi sessions must advance in order at ${width}x${height}`);
        frameRoot.querySelector('[data-action="next-round"]').click();
        const placeholder = frameRoot.querySelector(".pit-wall-circuit-placeholder");
        assert(placeholder && within(placeholder, main)
          && main.scrollHeight <= main.clientHeight + 1
          && placeholder.textContent.includes("Albert Park Grand Prix Circuit")
          && placeholder.textContent.includes("5.278 km"),
        `The next-round placeholder must fit at ${width}x${height}`);
        layoutGame.currentRoundIndex = layoutGame.seasonWeekends.length - 1;
        for (let i = 0; i < 5; i += 1) frameRoot.querySelector('[data-action="skip-session"]').click();
        const finish = frameRoot.querySelector(".pit-wall-season-finish");
        assert(finish && within(finish, main) && finish.scrollHeight <= finish.clientHeight + 1
          && finish.scrollWidth <= finish.clientWidth + 1,
        `Season completion must fit at ${width}x${height}`);
        const consoleElement = frameRoot.querySelector(".pit-wall-console");
        const bounds = consoleElement.getBoundingClientRect();
        assert(bounds.left >= 0 && bounds.top >= 0 && bounds.right <= width + 1 && bounds.bottom <= height + 1,
          `Console exceeds the ${width}x${height} viewport`);
        assert(doc.documentElement.clientWidth === width
          && frame.contentWindow.getComputedStyle(doc.documentElement).overflowY === "hidden",
        `Page scrollbar is visible at ${width}x${height}`);
        assert([...frameRoot.querySelectorAll(".pit-wall-panel-content")].every((panel) =>
          panel.scrollHeight <= panel.clientHeight + 1 && panel.scrollWidth <= panel.clientWidth + 1),
        `Panel content overflows at ${width}x${height}`);
      }
      frame.style.width = "1440px";
      frame.style.height = "900px";
      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      layoutGame.startDraft();
      frameRoot.querySelector("[data-driver-index]").click();
      frameRoot.querySelector("[data-driver-index] .pit-wall-confirm-button").click();
      frameRoot.querySelector("[data-team-index]").click();
      frameRoot.querySelector("[data-team-index] .pit-wall-confirm-button").click();
      frameRoot.querySelector('[data-weekend="bahrain"]').click();
      frameRoot.querySelector('[data-action="confirm-season"]').click();
      await frameRoot.querySelector(".pit-wall-circuit img").decode();
      assertCircuitCentred(frameRoot.querySelector(".pit-wall-circuit img"), "Saudi Arabia on desktop");
      layoutGame.startDraft();
      frameRoot.querySelector("[data-driver-index]").click();
      frameRoot.querySelector("[data-driver-index] .pit-wall-confirm-button").click();
      frameRoot.querySelector("[data-team-index]").click();
      frameRoot.querySelector("[data-team-index] .pit-wall-confirm-button").click();
      frameRoot.querySelector('[data-action="confirm-season"]').click();
      const desktopCircuit = frameRoot.querySelector(".pit-wall-circuit img");
      await desktopCircuit.decode();
      assertCircuitCentred(desktopCircuit, "Bahrain on desktop");
      assert(frame.contentWindow.location.href === originalUrl && !doc.querySelector("#games-pit-wall").hidden,
        "Confirmations must stay on the engineering screen without navigation");
      frameRoot.querySelector(".pit-wall-exit").click();
      assert(!doc.querySelector("#games-room-start").hidden, "Games Room link must return to the overview");
      frame.remove();
      results.textContent = "All Pit Wall regression tests passed.";
    } catch (error) {
      results.textContent = `FAILED: ${error.stack || error.message}`;
      console.error(error);
    }
  </script>
</body>
