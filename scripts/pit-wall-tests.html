<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pit Wall regression tests</title></head>
<body>
  <h1>Pit Wall regression tests</h1>
  <pre id="results">Running...</pre>
  <div id="fixture" hidden></div>
  <script type="module">
    import { PitWallConsole, drawDiscovery } from "../games/pit-wall.js";
    import { mountRouteMarker } from "../games/route-marker.js";
    import { createBalance } from "../games/pit-wall-balance.js";
    import { createPracticeClassification, advancePracticeClassification, practiceClassification, practiceTyres } from "../games/practice-classification.js";
    import { createSprintRace, advanceSprintRace, sprintClassification, SPRINT_POINTS, GRAND_PRIX_POINTS } from "../games/sprint-race.js";
    import { PRACTICE_DURATION, SPRINT_QUALIFYING_DURATION, createPracticeSession, advancePracticeSession, formatLapTime,
      fuelPerLap, setDriverMode, callToPit, parkPracticeSession, sendPracticeOut } from "../games/practice-session.js";

    const results = document.querySelector("#results");
    const root = document.querySelector("#fixture");
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    const waitForMarker = async (container) => {
      for (let i = 0; i < 100 && !container.querySelector(".pit-wall-moving-driver"); i += 1) {
        await new Promise((resolve) => setTimeout(resolve, 50));
      }
      assert(container.querySelector(".pit-wall-moving-driver"), "Session markers did not load");
    };

    try {
      const neutralDriver = { strengths: [], weakness: "None" };
      const neutralTeam = { bonus: "None", weakness: "None" };
      const aiBalance = createBalance();
      Object.assign(aiBalance.practiceAI, {
        initialDelayMinMs: 1000, initialDelayMaxMs: 1000, garageMinMs: 1000, garageMaxMs: 1000,
        stintMinLaps: 2, stintMaxLaps: 2,
      });
      const aiDriver = { name: "Test Driver", strengths: [], weakness: "None" };
      const playerDriver = { name: "Player Driver", ...neutralDriver };
      const raceGrid = [
        { driver: aiDriver, team: neutralTeam, player: false },
        { driver: playerDriver, team: neutralTeam, player: true },
      ];
      const raceBalance = createBalance();
      raceBalance.sprintRace.aiPitChance = 0;
      const makeRace = (fuel = 100, upgrades = []) => createSprintRace(raceGrid, 5.412, "Sunny", "Green",
        { tyre: "Soft", fuel }, upgrades, raceBalance, () => .5);
      const passingRace = makeRace();
      const leader = passingRace.entries[0].session;
      const challenger = passingRace.entries[1].session;
      assert(passingRace.laps === 19 && challenger.lapProgress < leader.lapProgress
        && sprintClassification(passingRace)[0].driver === aiDriver,
      "The sprint must start over 100 km in qualifying grid order");
      leader.tyre = "Hard";
      setDriverMode(leader, "Manage");
      setDriverMode(challenger, "Push");
      advanceSprintRace(passingRace, 400000, "Soft");
      assert(sprintClassification(passingRace)[0].player,
        "A faster car must pass a slower car as their track distances cross");
      const pitRace = makeRace();
      const pitPlayer = pitRace.entries[1].session;
      callToPit(pitPlayer);
      advanceSprintRace(pitRace, 140000, "Hard");
      assert(pitPlayer.tyre === "Hard" && pitPlayer.pitState === "none"
        && pitPlayer.fuel < 100 && pitPlayer.fuel > 90,
      "A race pit stop must fit the selected tyres without refuelling");
      raceBalance.lap.pitBaseMs = 0;
      raceBalance.lap.pitMinimumMs = 0;
      const instantPit = makeRace();
      callToPit(instantPit.entries[1].session);
      advanceSprintRace(instantPit, 120000, "Hard");
      assert(instantPit.entries[1].session.tyre === "Hard",
        "A zero-time pit stop must still complete and change tyres");
      raceBalance.lap.pitBaseMs = 21500;
      raceBalance.lap.pitMinimumMs = 5000;
      const dryRace = makeRace(10);
      advanceSprintRace(dryRace, 1500000, "Soft");
      assert(dryRace.entries[1].retired && dryRace.entries[1].session.fuel === 0,
        "Running out of race fuel must retire the car instead of allowing free laps");
      const lappedRace = makeRace();
      lappedRace.laps = 2;
      lappedRace.entries[1].session.lapProgress = -1.5;
      assert(advanceSprintRace(lappedRace, 1000000, "Soft")
        && lappedRace.flagTime !== null && lappedRace.entries[1].session.completedLaps === 1
        && sprintClassification(lappedRace)[0] === lappedRace.entries[0],
      "Lapped cars must finish at their next line crossing after the leader takes the flag");
      const deterministicRace = () => {
        let seed = 42;
        const random = () => {
          seed = seed * 16807 % 2147483647;
          return (seed - 1) / 2147483646;
        };
        return createSprintRace(raceGrid, 5.412, "Sunny", "Green", { tyre: "Medium", fuel: 100 },
          [], raceBalance, random);
      };
      const wholeRace = deterministicRace();
      const slicedRace = deterministicRace();
      advanceSprintRace(wholeRace, 1800000, "Hard");
      for (let tick = 0; tick < 60; tick += 1) advanceSprintRace(slicedRace, 30000, "Hard");
      assert(JSON.stringify(sprintClassification(wholeRace).map((entry) => [entry.driver.name, entry.retired, entry.session.lapTimes]))
        === JSON.stringify(sprintClassification(slicedRace).map((entry) => [entry.driver.name, entry.retired, entry.session.lapTimes]))
        && wholeRace.entries.every((entry, index) =>
          Math.abs(entry.session.fuel - slicedRace.entries[index].session.fuel) < 1e-7),
      "Race results must not depend on clock update size or simulation speed");
      const upgradedRace = makeRace(100, [{ stat: "Aero", amount: 4 }, { id: "fuel-mapping", level: 1 }]);
      assert(upgradedRace.entries[1].session.lapTarget < makeRace().entries[1].session.lapTarget
        && fuelPerLap(raceBalance, "Balanced", upgradedRace.entries[1].session.upgrades, 5.412)
          < fuelPerLap(raceBalance, "Balanced", [], 5.412),
      "Permanent and weekend upgrades must affect the immediately following sprint");
      const monacoRate = fuelPerLap(raceBalance, "Balanced", [], 3.337);
      assert(Math.abs(monacoRate - raceBalance.lap.fuelPerLap * 3.337 / raceBalance.lap.referenceLengthKm) < 1e-10
        && 78 * monacoRate < 100,
      "Fuel per lap must scale with circuit length so a full Monaco Grand Prix is possible");
      const monacoPractice = createPracticeSession(playerDriver, neutralTeam, [], 3.337, () => .5,
        { tyre: "Medium", fuel: 100 }, raceBalance);
      advancePracticeSession(monacoPractice, monacoPractice.lapTarget);
      assert(Math.abs(monacoPractice.fuel - (100 - monacoRate)) < 1e-8,
        "A Monaco practice lap must consume the circuit-adjusted fuel rate");
      const monacoRace = createSprintRace(raceGrid, 3.337, "Sunny", "Green", { tyre: "Medium", fuel: 100 },
        [], raceBalance, () => .5, { laps: 78, grandPrix: true });
      advanceSprintRace(monacoRace, 20000000, "Medium");
      assert(monacoRace.entries.every((entry) => !entry.retired && entry.finishedAt !== null),
        "A full-fuel Monaco Grand Prix must produce finishers for both player and AI");
      assert(SPRINT_POINTS.join(",") === "8,7,6,5,4,3,2,1", "Sprint points must follow the requested scoring");
      let raceSeed = 17;
      const raceRandom = () => {
        raceSeed = (raceSeed * 16807) % 2147483647;
        return (raceSeed - 1) / 2147483646;
      };
      const variedGrid = Array.from({ length: 10 }, (_, index) => ({
        driver: { name: `Driver ${index}`, ...neutralDriver }, team: neutralTeam, player: index === 0,
      }));
      const variedBalance = createBalance();
      const variedRace = createSprintRace(variedGrid, 5.412, "Sunny", "Green", { tyre: "Medium", fuel: 100 },
        [], variedBalance, raceRandom);
      const opponents = variedRace.entries.filter((entry) => !entry.player);
      const scheduledStop = opponents.find((entry) => entry.pitLap !== null);
      assert(scheduledStop && opponents.some((entry) => entry.pitLap === null)
        && new Set(opponents.map((entry) => entry.session.tyre)).size > 1
        && new Set(opponents.map((entry) => entry.session.mode)).size > 1
        && new Set(opponents.map((entry) => entry.session.fuel)).size > 1,
      "AI sprint strategies must vary their tyres, modes, fuel and pit plans");
      advanceSprintRace(variedRace, 1200000, "Medium");
      assert(scheduledStop.pitLap === null && scheduledStop.session.tyre === scheduledStop.pitTyre,
        "An AI driver with a pit plan must actually change tyres during the race");
      const makeGrandPrix = (balance = createBalance()) => {
        let seed = 17;
        const random = () => {
          seed = seed * 16807 % 2147483647;
          return (seed - 1) / 2147483646;
        };
        return createSprintRace(variedGrid, 5.412, "Sunny", "Green", { tyre: "Medium", fuel: 100 },
          [], balance, random, { laps: 57, grandPrix: true });
      };
      const grandPrix = makeGrandPrix();
      const slicedGrandPrix = makeGrandPrix();
      setDriverMode(grandPrix.entries[0].session, "Manage");
      setDriverMode(slicedGrandPrix.entries[0].session, "Manage");
      advanceSprintRace(grandPrix, 20000000, "Hard");
      for (let tick = 0; tick < 200; tick += 1) advanceSprintRace(slicedGrandPrix, 100000, "Hard");
      assert(grandPrix.laps === 57 && grandPrix.flagTime !== null
        && sprintClassification(grandPrix)[0].session.completedLaps === 57
        && grandPrix.entries.some((entry) => !entry.player && entry.pitStops > 0 && entry.tyreHistory.length > 1)
        && grandPrix.entries.some((entry) => !entry.player && !entry.retired),
      "A Grand Prix must run 57 laps with AI tyre stops and fuel-managed finishers");
      assert(JSON.stringify(grandPrix.entries.map((entry) => [entry.retired, entry.session.lapTimes, entry.tyreHistory]))
        === JSON.stringify(slicedGrandPrix.entries.map((entry) => [entry.retired, entry.session.lapTimes, entry.tyreHistory])),
      "Grand Prix strategy and results must not depend on clock update size");
      const pitBalance = createBalance();
      pitBalance.grandPrix.aiPitWearMin = 0;
      pitBalance.grandPrix.aiPitWearMax = 0;
      const pitTuning = makeGrandPrix(pitBalance);
      advanceSprintRace(pitTuning, 400000, "Medium");
      assert(pitTuning.entries.some((entry) => !entry.player && entry.pitStops > 0),
        "Grand Prix AI tyre-wear settings must affect pit decisions");
      assert(GRAND_PRIX_POINTS.join(",") === "25,18,15,12,10,8,6,4,2,1",
        "Grand Prix points must follow the requested scoring");
      const qualifyingBalance = createBalance();
      const qualifyingSession = (tyre, fuel) => createPracticeSession(playerDriver, neutralTeam, [], 5.412,
        () => .5, { tyre, fuel }, qualifyingBalance, 0, true);
      const qualifying = qualifyingSession("Soft", 10);
      parkPracticeSession(qualifying);
      advancePracticeSession(qualifying, 5000);
      assert(qualifying.elapsed === 5000 && qualifying.lapTimes.length === 0 && qualifying.fuel === 10,
        "Qualifying must start in the garage without consuming fuel");
      sendPracticeOut(qualifying, { tyre: "Soft", fuel: 10 });
      setDriverMode(qualifying, "Push");
      advancePracticeSession(qualifying, qualifying.lapTarget);
      assert(!qualifying.outLap && qualifying.completedLaps === 1 && qualifying.lapTimes.length === 0,
        "An out lap must not count as a qualifying time");
      advancePracticeSession(qualifying, qualifying.lapTarget);
      assert(qualifying.lapTimes.length === 1 && qualifying.lapTyres[0] === "Soft",
        "A flying lap must set a timed result on its actual compound");
      callToPit(qualifying);
      advancePracticeSession(qualifying, qualifying.lapTarget + 21500);
      assert(qualifying.pitState === "stopped" && sendPracticeOut(qualifying, { tyre: "Medium", fuel: 10 })
        && qualifying.outLap, "Every new qualifying stint must begin with another out lap");
      const timedBeforeOutLap = qualifying.lapTimes.length;
      advancePracticeSession(qualifying, qualifying.lapTarget);
      assert(qualifying.lapTimes.length === timedBeforeOutLap,
        "Later out laps must not replace the qualifying best");
      const fuelRate = fuelPerLap(qualifyingBalance, "Push", [], 5.412);
      const targets = [2, 3, 4].map((laps) => {
        const fuel = Math.ceil(laps * fuelRate * 10) / 10;
        const run = qualifyingSession("Soft", fuel);
        setDriverMode(run, "Push");
        advancePracticeSession(run, run.lapTarget);
        const flyingTarget = run.lapTarget;
        advancePracticeSession(run, run.lapTarget);
        assert(run.lapTimes.length === 1, `${laps}-lap fuel must allow a flying lap after the out lap`);
        return flyingTarget;
      });
      assert(targets[0] < targets[1] && targets[1] < targets[2],
        "Two-, three- and four-lap fuel loads must have distinct pace effects");
      const dryRun = qualifyingSession("Soft", .1);
      advancePracticeSession(dryRun, dryRun.lapTarget);
      advancePracticeSession(dryRun, dryRun.lapTarget);
      assert(dryRun.lapTimes.length === 0 && dryRun.invalidLaps === 1,
        "A flying lap without sufficient fuel must not set a qualifying time");
      advancePracticeSession(dryRun, SPRINT_QUALIFYING_DURATION);
      assert(dryRun.elapsed === SPRINT_QUALIFYING_DURATION,
        "Sprint qualifying must stop at exactly 15 minutes");
      Object.assign(qualifyingBalance.qualifyingAI, {
        initialDelayMinMs: 1000, initialDelayMaxMs: 1000, garageMinMs: 1000, garageMaxMs: 1000,
        flyingLapsMin: 1, flyingLapsMax: 1,
      });
      let qualifyingRoll = .1;
      const qualifyingAI = createPracticeClassification(playerDriver, neutralTeam,
        [{ driver: { name: "Qualifying AI", ...neutralDriver }, team: neutralTeam }], 5.412,
        "Sunny", "Green", qualifyingBalance, () => qualifyingRoll, true);
      const qualifier = qualifyingAI.opponents[0];
      advancePracticeClassification(qualifyingAI, 1000);
      assert(qualifier.session.tyre === "Soft" && qualifier.session.mode === "Push"
        && qualifier.session.fuel >= 2 * fuelRate, "AI must use Push with enough fuel for its planned laps");
      advancePracticeClassification(qualifyingAI, qualifier.session.lapTarget);
      assert(qualifier.bestLap === null && qualifier.session && !qualifier.session.outLap,
        "AI out laps must not appear in qualifying classification");
      advancePracticeClassification(qualifyingAI, qualifier.session.lapTarget);
      assert(qualifier.bestLap !== null && qualifier.bestLapTyre === "Soft" && qualifier.session === null,
        "AI flying laps must be classified before returning to the garage");
      qualifyingRoll = .9;
      advancePracticeClassification(qualifyingAI, 1000);
      assert(qualifier.session && qualifier.session.tyre === "Medium" && qualifier.session.outLap,
        "AI must make another run and allow mixed dry compounds");
      const aiClassification = createPracticeClassification(playerDriver, neutralTeam,
        [{ driver: aiDriver, team: neutralTeam }], 5.412, "Sunny", "Green", aiBalance, () => .5);
      const playerPractice = createPracticeSession(playerDriver, neutralTeam, [], 5.412, () => .5);
      const ai = aiClassification.opponents[0];
      assert(practiceClassification(aiClassification, playerPractice).every((entry) => entry.bestLap === null)
        && ai.session === null, "Classification must start without timed laps and AI in the garage");
      advancePracticeClassification(aiClassification, 999);
      assert(ai.session === null, "AI must wait until its scheduled garage exit");
      advancePracticeClassification(aiClassification, 0);
      assert(ai.garageRemaining === 1, "Paused simulation must not advance AI run plans");
      advancePracticeClassification(aiClassification, 1);
      assert(ai.session && ai.session.tyre === "Medium", "AI must start a dry-tyre run after its scheduled exit");
      advancePracticeClassification(aiClassification, ai.session.lapTarget);
      assert(ai.bestLap !== null && practiceClassification(aiClassification, playerPractice)[0].driver === aiDriver,
        "AI laps must populate and sort the classification");
      advancePracticeClassification(aiClassification, ai.session.lapTarget);
      assert(ai.session === null && practiceClassification(aiClassification, playerPractice)[0].inPit,
        "AI must return to the garage after its stint");
      advancePracticeClassification(aiClassification, 1000);
      assert(ai.session && ai.session.lapTimes.length === 0, "AI must be able to leave for another stint");
      playerPractice.lapTimes.push(ai.bestLap - 500);
      playerPractice.lapTyres.push("Medium");
      assert(practiceClassification(aiClassification, playerPractice)[0].player,
        "The player's best lap must participate in classification ordering");
      const tyrePractice = createPracticeSession(playerDriver, neutralTeam, [], 5.412, () => .5);
      const playerLap = (tyre, time) => {
        if (tyrePractice.pitState === "stopped") sendPracticeOut(tyrePractice, { tyre, fuel: 100 });
        tyrePractice.lapTarget = time;
        callToPit(tyrePractice);
        advancePracticeSession(tyrePractice, time + 21500);
      };
      playerLap("Medium", 100000);
      assert(practiceClassification(aiClassification, tyrePractice).find((entry) => entry.player).bestLapTyre === "Medium",
        "The player's best lap must record its compound");
      sendPracticeOut(tyrePractice, { tyre: "Hard", fuel: 100 });
      assert(practiceClassification(aiClassification, tyrePractice).find((entry) => entry.player).bestLapTyre === "Medium",
        "Changing tyres without improving the best lap must not change its compound");
      playerLap("Hard", 101000);
      playerLap("Soft", 100000);
      assert(practiceClassification(aiClassification, tyrePractice).find((entry) => entry.player).bestLapTyre === "Medium",
        "A slower or equal lap must retain the first best lap's compound");
      playerLap("Wet", 99000);
      assert(practiceClassification(aiClassification, tyrePractice).find((entry) => entry.player).bestLapTyre === "Wet",
        "A faster lap must replace the player's best-lap compound");
      let tyreRoll = .5;
      const tyreAI = createPracticeClassification(playerDriver, neutralTeam,
        [{ driver: aiDriver, team: neutralTeam }], 5.412, "Sunny", "Green", aiBalance, () => tyreRoll);
      const aiEntry = tyreAI.opponents[0];
      const aiLap = (roll, time) => {
        tyreRoll = roll;
        advancePracticeClassification(tyreAI, aiEntry.garageRemaining);
        aiEntry.stintLaps = 1;
        aiEntry.modeRemaining = 200000;
        aiEntry.session.lapTarget = time;
        advancePracticeClassification(tyreAI, time);
      };
      aiLap(.5, 100000);
      aiLap(.99, 101000);
      assert(aiEntry.bestLap === 100000 && aiEntry.bestLapTyre === "Medium" && !aiEntry.session,
        "AI best-lap compounds must survive a slower stint and a return to the garage");
      aiLap(0, 99000);
      assert(aiEntry.bestLap === 99000 && aiEntry.bestLapTyre === "Soft"
        && practiceClassification(tyreAI, playerPractice).find((entry) => !entry.player).bestLapTyre === "Soft",
      "A faster AI stint must update the best-lap compound in classification");
      const makeBatch = () => createPracticeClassification(playerDriver, neutralTeam,
        [{ driver: aiDriver, team: neutralTeam }], 5.412, "Sunny", "Green", aiBalance, () => .5);
      const batch = makeBatch();
      const incremental = makeBatch();
      advancePracticeClassification(batch, 600000);
      for (let i = 0; i < 60; i += 1) advancePracticeClassification(incremental, 10000);
      assert(batch.opponents[0].bestLap === incremental.opponents[0].bestLap
        && Boolean(batch.opponents[0].session) === Boolean(incremental.opponents[0].session),
      "Fast-forward and smaller clock advances must agree for a deterministic AI run");
      let aiRoll = 0;
      const varied = createPracticeClassification(playerDriver, neutralTeam,
        [{ driver: aiDriver, team: neutralTeam }], 5.412, "Sunny", "Green", aiBalance, () => aiRoll);
      advancePracticeClassification(varied, 1000);
      const variedSession = varied.opponents[0].session;
      assert(variedSession.tyre === "Soft" && variedSession.fuel === aiBalance.practiceAI.fuelMinPercent
        && variedSession.mode === "Push" && variedSession.programPaceMs < 0,
      "AI run plans must use their selected tyre, fuel, mode and hidden programme");
      aiRoll = .999999;
      advancePracticeClassification(varied, aiBalance.practiceAI.modeChangeMinMs + 1);
      assert(variedSession.mode === "Manage", "AI must change driver mode during a stint");
      assert(practiceTyres("Sunny", "Green").join() === "Soft,Medium,Hard"
        && practiceTyres("Drizzle", "Wet track").join() === "Intermediate"
        && practiceTyres("Heavy rain", "Standing water").join() === "Wet"
        && practiceTyres("Heavy rain", "Green").join() === "Soft,Medium,Hard",
      "AI wet tyres must require matching weather and track conditions");
      for (const [tyre, fuel] of [["Soft", 10], ["Hard", 100], ["Intermediate", 45], ["Wet", 75]]) {
        const configured = createPracticeSession(neutralDriver, neutralTeam, [], 5.412, () => .5, { tyre, fuel });
        assert(configured.tyre === tyre && configured.fuel === fuel && configured.tyreWear === 0,
          `${tyre} and ${fuel}% must initialise the practice session`);
      }
      for (const setup of [{ tyre: "Unknown", fuel: 50 }, { tyre: "Soft", fuel: 9 }, { tyre: "Soft", fuel: 101 }]) {
        let rejected = false;
        try { createPracticeSession(neutralDriver, neutralTeam, [], 5.412, () => .5, setup); } catch { rejected = true; }
        assert(rejected, "Invalid practice setup must be rejected");
      }
      const practiceBaseline = () => createPracticeSession(neutralDriver, neutralTeam, [], 5.412, () => .5);
      const baseline = practiceBaseline();
      const improved = createPracticeSession(
        { strengths: ["Braking"], weakness: "None" },
        { bonus: "Straight-line speed", weakness: "None" },
        [{ stat: "Handling", amount: 2 }, { stat: "Aero", amount: 3 }, { stat: "Energy Recovery", amount: 1 }],
        5.412, () => .5);
      assert(improved.lapTarget < baseline.lapTarget && baseline.lapTarget >= 89000 && baseline.lapTarget <= 100000,
        "Driver, team and relevant upgrades must improve realistic Bahrain lap times");
      for (const roll of [0, .5, .999999]) {
        const lap = createPracticeSession(
          { strengths: ["Qualifying pace", "Braking"], weakness: "None" },
          { bonus: "Straight-line speed", weakness: "None" },
          [{ stat: "Handling", amount: 20 }, { stat: "Aero", amount: 20 }, { stat: "Energy Recovery", amount: 20 }],
          5.412, () => roll).lapTarget;
        assert(lap >= 89000 && lap <= 100000, "Bahrain lap times must remain in the requested realistic range");
      }
      assert(createPracticeSession({ strengths: ["Braking"], weakness: "None" }, neutralTeam, [], 5.412, () => .5).lapTarget < baseline.lapTarget
        && createPracticeSession(neutralDriver, { bonus: "Straight-line speed", weakness: "None" }, [], 5.412, () => .5).lapTarget < baseline.lapTarget
        && createPracticeSession({ strengths: [], weakness: "Braking" }, neutralTeam, [], 5.412, () => .5).lapTarget > baseline.lapTarget
        && createPracticeSession(neutralDriver, { bonus: "None", weakness: "Cornering" }, [], 5.412, () => .5).lapTarget > baseline.lapTarget,
      "Driver and team strengths and weaknesses must each affect practice pace");
      for (const upgrade of [{ stat: "Handling", amount: 1 }, { stat: "Aero", amount: 1 }, { stat: "Energy Recovery", amount: 1 }]) {
        assert(createPracticeSession(neutralDriver, neutralTeam, [upgrade], 5.412, () => .5).lapTarget < baseline.lapTarget,
          `${upgrade.stat} must affect lap performance`);
      }
      const boosted = createPracticeSession(neutralDriver, neutralTeam, [{ stat: "Handling", amount: 2 }], 5.412, () => .5);
      const unboosted = createPracticeSession(neutralDriver, neutralTeam, [{ stat: "Handling", amount: 1 }], 5.412, () => .5);
      assert(boosted.lapTarget < unboosted.lapTarget, "Amplified upgrade values must affect practice performance");
      for (let lap = 0; lap < 3; lap += 1) advancePracticeSession(baseline, baseline.lapTarget);
      assert(baseline.lapTimes.length === 3 && baseline.lapElapsed === 0,
        "Crossing exactly three lap boundaries must count three completed laps");
      advancePracticeSession(baseline, PRACTICE_DURATION);
      assert(baseline.elapsed === PRACTICE_DURATION && baseline.lapTimes.length > 3
        && formatLapTime(91442) === "1:31.442",
      "Practice must stop precisely at 60 simulated minutes and format lap times");

      const attack = practiceBaseline();
      const balanced = practiceBaseline();
      const defend = practiceBaseline();
      setDriverMode(attack, "Push");
      setDriverMode(defend, "Manage");
      assert(balanced.lapTarget - attack.lapTarget >= 300 && balanced.lapTarget - attack.lapTarget <= 500
        && defend.lapTarget - balanced.lapTarget >= 200 && defend.lapTarget - balanced.lapTarget <= 400,
      "A full Push or Manage lap must meet the specified pace differences");
      for (const practice of [attack, balanced, defend]) advancePracticeSession(practice, practice.lapTarget);
      assert(attack.tyreWear > balanced.tyreWear && balanced.tyreWear > defend.tyreWear
        && attack.fuel < balanced.fuel && balanced.fuel < defend.fuel
        && attack.lapTimes[0] < balanced.lapTimes[0] && balanced.lapTimes[0] < defend.lapTimes[0],
      "Driver modes must affect tyre wear and fuel consumption");
      const configuredPractice = (tyre, fuel, random = () => .5) =>
        createPracticeSession(neutralDriver, neutralTeam, [], 5.412, random, { tyre, fuel });
      const pace = (tyre, fuel) => configuredPractice(tyre, fuel).lapTarget;
      assert(pace("Medium", 100) - pace("Soft", 100) >= 500
        && pace("Hard", 100) - pace("Medium", 100) >= 500
        && pace("Intermediate", 100) === pace("Medium", 100)
        && pace("Wet", 100) === pace("Medium", 100)
        && pace("Medium", 100) - pace("Medium", 10) >= 1000,
      "Compounds, tyre wear and fuel load must affect pace");
      const soft = configuredPractice("Soft", 100);
      const hard = configuredPractice("Hard", 100);
      advancePracticeSession(soft, soft.lapTarget);
      advancePracticeSession(hard, hard.lapTarget);

      try {
        window.fetch = () => Promise.reject(new Error("Test route unavailable"));
        debugRoot.querySelector('[data-action="start-session"]').click();
        for (let i = 0; i < 100 && !debugRoot.querySelector('[data-action="retry-marker"]'); i += 1) {
          await new Promise((resolve) => setTimeout(resolve, 20));
        }
        assert(debugRoot.querySelector('[role="alert"]').textContent.includes("Could not load")
          && debugRoot.querySelector('[data-action="complete-session"]').disabled,
        "Route loading failures must be visible and must not complete the session");
      } finally {
        window.fetch = originalFetch;
      }
      debugRoot.querySelector('[data-action="retry-marker"]').click();
      await waitForMarker(debugRoot);
      assert(!debugRoot.querySelector('[role="alert"]')
        && !debugRoot.querySelector('[data-action="complete-session"]').disabled,
      "Retrying a failed route load must restore the marker and completion control");
      debugRoot.querySelector('[data-action="complete-session"]').click();
      debugRoot.querySelector('[data-action="continue-review"]').click();

      for (const action of ["restart-weekend", "new-game"]) {
        debugGame.routes.delete("bahrain");
        debugGame.renderWeekend(bahrainWeekend);
        const response = await originalFetch("../games/bahrain-route.json");
        let finishFetch;
        try {
          window.fetch = () => new Promise((resolve) => { finishFetch = resolve; });
          debugRoot.querySelector('[data-action="start-session"]').click();
          for (let i = 0; i < 100 && !finishFetch; i += 1) {
            await new Promise((resolve) => setTimeout(resolve, 10));
          }
          assert(finishFetch, "The delayed route request must begin");
          if (action === "new-game") debugGame.startDraft();
          else debugGame.renderWeekend(bahrainWeekend);
          finishFetch(response);
          await new Promise((resolve) => setTimeout(resolve, 50));
          assert(!debugRoot.querySelector(".pit-wall-moving-driver") && !debugGame.routeMarker,
            `A stale route load must not restore the marker after ${action}`);
        } finally {
          window.fetch = originalFetch;
        }
      }
      debugFrame.remove();
      results.textContent = "All Pit Wall regression tests passed.";
    } catch (error) {
      results.textContent = `FAILED: ${error.stack || error.message}`;
      console.error(error);
    }
  </script>
</body>
</html>
