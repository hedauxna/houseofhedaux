<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Pit Wall regression tests</title></head>
<body>
  <h1>Pit Wall regression tests</h1>
  <pre id="results">Running...</pre>
  <div id="fixture" hidden></div>
  <script type="module">
    import { PitWallConsole, drawDiscovery } from "../games/pit-wall.js";
    import { mountRouteMarker } from "../games/route-marker.js";
    import { createBalance } from "../games/pit-wall-balance.js";
    import { PRACTICE_DURATION, createPracticeSession, advancePracticeSession, formatLapTime,
      setDriverMode, callToPit, selectPitTyre } from "../games/practice-session.js";

    const results = document.querySelector("#results");
    const root = document.querySelector("#fixture");
    const assert = (condition, message) => {
      if (!condition) throw new Error(message);
    };
    const waitForMarker = async (container) => {
      for (let i = 0; i < 100 && !container.querySelector(".pit-wall-moving-driver"); i += 1) {
        await new Promise((resolve) => setTimeout(resolve, 50));
      }
      assert(container.querySelector(".pit-wall-moving-driver"), "Bahrain marker did not load");
    };

    try {
      const neutralDriver = { strengths: [], weakness: "None" };
      const neutralTeam = { bonus: "None", weakness: "None" };
      for (const [tyre, fuel] of [["Soft", 10], ["Hard", 100], ["Intermediate", 45], ["Wet", 75]]) {
        const configured = createPracticeSession(neutralDriver, neutralTeam, [], 5.412, () => .5, { tyre, fuel });
        assert(configured.tyre === tyre && configured.fuel === fuel && configured.tyreWear === 0,
          `${tyre} and ${fuel}% must initialise the practice session`);
      }
      for (const setup of [{ tyre: "Unknown", fuel: 50 }, { tyre: "Soft", fuel: 9 }, { tyre: "Soft", fuel: 101 }]) {
        let rejected = false;
        try { createPracticeSession(neutralDriver, neutralTeam, [], 5.412, () => .5, setup); } catch { rejected = true; }
        assert(rejected, "Invalid practice setup must be rejected");
      }
      const practiceBaseline = () => createPracticeSession(neutralDriver, neutralTeam, [], 5.412, () => .5);
      const baseline = practiceBaseline();
      const improved = createPracticeSession(
        { strengths: ["Braking"], weakness: "None" },
        { bonus: "Straight-line speed", weakness: "None" },
        [{ stat: "Handling", amount: 2 }, { stat: "Aero", amount: 3 }, { stat: "Energy Recovery", amount: 1 }],
        5.412, () => .5);
      assert(improved.lapTarget < baseline.lapTarget && baseline.lapTarget >= 89000 && baseline.lapTarget <= 100000,
        "Driver, team and relevant upgrades must improve realistic Bahrain lap times");
      for (const roll of [0, .5, .999999]) {
        const lap = createPracticeSession(
          { strengths: ["Qualifying pace", "Braking"], weakness: "None" },
          { bonus: "Straight-line speed", weakness: "None" },
          [{ stat: "Handling", amount: 20 }, { stat: "Aero", amount: 20 }, { stat: "Energy Recovery", amount: 20 }],
          5.412, () => roll).lapTarget;
        assert(lap >= 89000 && lap <= 100000, "Bahrain lap times must remain in the requested realistic range");
      }
      assert(createPracticeSession({ strengths: ["Braking"], weakness: "None" }, neutralTeam, [], 5.412, () => .5).lapTarget < baseline.lapTarget
        && createPracticeSession(neutralDriver, { bonus: "Straight-line speed", weakness: "None" }, [], 5.412, () => .5).lapTarget < baseline.lapTarget
        && createPracticeSession({ strengths: [], weakness: "Braking" }, neutralTeam, [], 5.412, () => .5).lapTarget > baseline.lapTarget
        && createPracticeSession(neutralDriver, { bonus: "None", weakness: "Cornering" }, [], 5.412, () => .5).lapTarget > baseline.lapTarget,
      "Driver and team strengths and weaknesses must each affect practice pace");
      for (const upgrade of [{ stat: "Handling", amount: 1 }, { stat: "Aero", amount: 1 }, { stat: "Energy Recovery", amount: 1 }]) {
        assert(createPracticeSession(neutralDriver, neutralTeam, [upgrade], 5.412, () => .5).lapTarget < baseline.lapTarget,
          `${upgrade.stat} must affect lap performance`);
      }
      const boosted = createPracticeSession(neutralDriver, neutralTeam, [{ stat: "Handling", amount: 2 }], 5.412, () => .5);
      const unboosted = createPracticeSession(neutralDriver, neutralTeam, [{ stat: "Handling", amount: 1 }], 5.412, () => .5);
      assert(boosted.lapTarget < unboosted.lapTarget, "Amplified upgrade values must affect practice performance");
      for (let lap = 0; lap < 3; lap += 1) advancePracticeSession(baseline, baseline.lapTarget);
      assert(baseline.lapTimes.length === 3 && baseline.lapElapsed === 0,
        "Crossing exactly three lap boundaries must count three completed laps");
      advancePracticeSession(baseline, PRACTICE_DURATION);
      assert(baseline.elapsed === PRACTICE_DURATION && baseline.lapTimes.length > 3
        && formatLapTime(91442) === "1:31.442",
      "Practice must stop precisely at 60 simulated minutes and format lap times");

      const attack = practiceBaseline();
      const balanced = practiceBaseline();
      const defend = practiceBaseline();
      setDriverMode(attack, "Attack");
      setDriverMode(defend, "Defend");
      assert(balanced.lapTarget - attack.lapTarget >= 300 && balanced.lapTarget - attack.lapTarget <= 500
        && defend.lapTarget - balanced.lapTarget >= 200 && defend.lapTarget - balanced.lapTarget <= 400,
      "A full Attack or Defend lap must meet the specified pace differences");
      for (const practice of [attack, balanced, defend]) advancePracticeSession(practice, practice.lapTarget);
      assert(attack.tyreWear > balanced.tyreWear && balanced.tyreWear > defend.tyreWear
        && attack.fuel < balanced.fuel && balanced.fuel < defend.fuel
        && attack.lapTimes[0] < balanced.lapTimes[0] && balanced.lapTimes[0] < defend.lapTimes[0],
      "Driver modes must affect tyre wear and fuel consumption");
      const configuredPractice = (tyre, fuel, random = () => .5) =>
        createPracticeSession(neutralDriver, neutralTeam, [], 5.412, random, { tyre, fuel });
      const pace = (tyre, fuel) => configuredPractice(tyre, fuel).lapTarget;
      assert(pace("Medium", 100) - pace("Soft", 100) >= 500
        && pace("Hard", 100) - pace("Medium", 100) >= 500
        && pace("Intermediate", 100) === pace("Medium", 100)
        && pace("Wet", 100) === pace("Medium", 100)
        && pace("Medium", 100) - pace("Medium", 10) >= 1000,
      "Compounds, tyre wear and fuel load must affect pace");
      const soft = configuredPractice("Soft", 100);
      const hard = configuredPractice("Hard", 100);
      advancePracticeSession(soft, soft.lapTarget);
      advancePracticeSession(hard, hard.lapTarget);
      assert(soft.tyreWear > balanced.tyreWear && balanced.tyreWear > hard.tyreWear
        && soft.lapTimes[0] < balanced.lapTimes[0] && balanced.lapTimes[0] < hard.lapTimes[0],
      "Soft and hard must produce distinct lap times and degradation");
      const modeAtRoll = (mode, roll) => {
        const practice = configuredPractice("Medium", 100, () => roll);
        setDriverMode(practice, mode);
        advancePracticeSession(practice, practice.lapTarget);
        return practice.lapTimes[0];
      };
      assert(modeAtRoll("Attack", 1) < modeAtRoll("Balanced", 0)
        && modeAtRoll("Defend", 0) > modeAtRoll("Balanced", 1),
      "Even opposite extremes of lap variation must not mask a full-lap mode change");
      const midpoint = practiceBaseline();
      const midpointTarget = midpoint.lapTarget;
      advancePracticeSession(midpoint, midpointTarget / 2);
      setDriverMode(midpoint, "Attack");
      assert(midpoint.lapTarget === midpointTarget - 400, "A mid-lap command must not reapply wear or fuel");
      advancePracticeSession(midpoint, (1 - midpoint.lapProgress) * midpoint.lapTarget);
      assert(midpoint.lapTimes[0] === midpointTarget - 200,
        "A half-lap Attack command must affect only the remaining half of the lap");
      const stint = configuredPractice("Soft", 100);
      for (let lap = 0; lap < 18; lap += 1) advancePracticeSession(stint, stint.lapTarget);
      assert(stint.lapTimes[1] > stint.lapTimes[0] && stint.tyreWear === 100,
        "Tyre degradation must increase successive lap times and eventually reach full wear");
      const wornLap = stint.lapTarget;
      advancePracticeSession(stint, stint.lapTarget);
      assert(stint.lapTarget < wornLap && stint.fuel < 100,
        "With tyre condition unchanged, burning fuel must naturally improve lap pace");
      const changed = configuredPractice("Soft", 100);
      setDriverMode(changed, "Attack");
      advancePracticeSession(changed, changed.lapTarget);
      setDriverMode(changed, "Defend");
      advancePracticeSession(changed, changed.lapTarget);
      assert(changed.lapTimes[1] > changed.lapTimes[0],
        "Switching from Attack to Defend must produce a slower lap in history");
      const fullyUpgraded = createPracticeSession(
        { strengths: ["Qualifying pace", "Braking"], weakness: "None" },
        { bonus: "Straight-line speed", weakness: "None" },
        [{ stat: "Handling", amount: 20 }], 5.412, () => 0);
      const maxedBalanced = fullyUpgraded.lapTarget;
      setDriverMode(fullyUpgraded, "Attack");
      assert(fullyUpgraded.lapTarget < maxedBalanced, "Driver mode must still affect pace at the upgrade limit");
      const economy = createPracticeSession(neutralDriver, neutralTeam,
        [{ id: "tyre-insight", level: 2 }, { id: "fuel-mapping", level: 2 }], 5.412, () => .5);
      advancePracticeSession(economy, economy.lapTarget);
      assert(economy.tyreWear < balanced.tyreWear && economy.fuel > balanced.fuel,
        "Tyre and fuel efficiency discoveries must reduce consumption");
      const pit = practiceBaseline();
      advancePracticeSession(pit, pit.lapTarget / 2);
      const progressBeforeMode = pit.lapProgress;
      setDriverMode(pit, "Attack");
      assert(pit.lapProgress === progressBeforeMode && callToPit(pit) && !callToPit(pit),
        "Changing mode must not move the car and a pit call must not duplicate");
      advancePracticeSession(pit, (1 - pit.lapProgress) * pit.lapTarget);
      assert(pit.pitState === "stopped" && pit.lapProgress === 0 && pit.lapTimes.length === 1
        && pit.pitRemaining === 21500, "A called car must stop at the lap boundary");
      const pitFuel = pit.fuel;
      advancePracticeSession(pit, 10000);
      assert(pit.pitState === "stopped" && pit.pitRemaining === 11500 && pit.fuel === pitFuel,
        "The pit countdown must consume session time without movement or refuelling");
      assert(selectPitTyre(pit, "Soft") && pit.tyre === "Medium", "The selected tyre must wait for the pit timer");
      advancePracticeSession(pit, 11500);
      assert(pit.pitState === "none" && pit.tyre === "Soft" && pit.tyreWear === 0 && pit.fuel === pitFuel,
        "The car must leave on fresh selected tyres without refuelling");
      advancePracticeSession(pit, pit.lapTarget);
      assert(pit.lapTimes[1] > pit.lapTarget + 20000, "Pit time must count in the next completed lap");
      const waiting = practiceBaseline();
      callToPit(waiting);
      advancePracticeSession(waiting, waiting.lapTarget + 30000);
      assert(waiting.pitState === "stopped" && waiting.pitRemaining === 0,
        "The car must wait at the pit after the timer if no tyre is selected");
      selectPitTyre(waiting, "Hard");
      assert(waiting.pitState === "none" && waiting.tyre === "Hard",
        "A tyre selected after the countdown must release the car");
      const endingInPit = practiceBaseline();
      callToPit(endingInPit);
      advancePracticeSession(endingInPit, endingInPit.lapTarget);
      advancePracticeSession(endingInPit, PRACTICE_DURATION);
      assert(endingInPit.elapsed === PRACTICE_DURATION && endingInPit.pitState === "stopped"
        && endingInPit.lapTimes.length === 1,
      "The practice clock must expire while waiting in the pit without inventing laps");
      const efficient = createPracticeSession(neutralDriver, neutralTeam,
        [{ stat: "Pit Efficiency", amount: 3 }], 5.412, () => .5);
      callToPit(efficient);
      advancePracticeSession(efficient, efficient.lapTarget);
      assert(efficient.pitRemaining === 18500, "Effective pit efficiency upgrades must reduce the pit time");
      const editableBalance = createBalance();
      const tuned = createPracticeSession(neutralDriver, neutralTeam, [{ stat: "Handling", amount: 1 }],
        5.412, () => .5, { tyre: "Medium", fuel: 100 }, editableBalance);
      const untuned = createPracticeSession(neutralDriver, neutralTeam, [{ stat: "Handling", amount: 1 }],
        5.412, () => .5);
      editableBalance.vehicleStats.Handling.lapGainMs = 480;
      assert(tuned.lapTarget === untuned.lapTarget, "Balance edits must not rewrite a lap already underway");
      advancePracticeSession(tuned, tuned.lapTarget);
      advancePracticeSession(untuned, untuned.lapTarget);
      assert(untuned.lapTarget - tuned.lapTarget === 300,
        "Edited vehicle stat gains must affect the very next generated lap");
      const targetBeforeEdit = tuned.lapTarget;
      setDriverMode(tuned, "Attack");
      editableBalance.modes.Attack.pace = -1000;
      setDriverMode(tuned, "Balanced");
      assert(tuned.lapTarget === targetBeforeEdit,
        "Changing a mode's balance mid-lap must not distort a subsequent mode switch");
      editableBalance.tyres.Soft.wear = 10;
      editableBalance.modes.Attack.fuel = 2;
      const tunedConsumption = createPracticeSession(neutralDriver, neutralTeam, [], 5.412, () => .5,
        { tyre: "Soft", fuel: 100 }, editableBalance);
      setDriverMode(tunedConsumption, "Attack");
      advancePracticeSession(tunedConsumption, tunedConsumption.lapTarget);
      assert(Math.abs(tunedConsumption.tyreWear - 14) < .001 && Math.abs(tunedConsumption.fuel - 96.4) < .001,
        "Edited tyre and mode multipliers must drive actual wear and fuel consumption");
      const traitBalance = createBalance();
      const traitDriver = { strengths: ["Braking"], weakness: "None" };
      const traitTeam = { bonus: "Consistency", weakness: "None" };
      const traitPace = () => createPracticeSession(traitDriver, traitTeam, [], 5.412, () => .5,
        { tyre: "Medium", fuel: 100 }, traitBalance).lapTarget;
      const originalTraitPace = traitPace();
      traitBalance.driverTraits.Braking += 200;
      traitBalance.teamTraits.Consistency += 100;
      assert(originalTraitPace - traitPace() === 300, "Edited driver and team effects must alter lap pace");
      traitBalance.vehicleStats.Handling.base = 2;
      assert(originalTraitPace - traitPace() === 660,
        "Edited base vehicle points must contribute to lap pace");
      for (const [driver, team, upgrades] of [
        [{ strengths: ["Unregistered"], weakness: "None" }, neutralTeam, []],
        [neutralDriver, { bonus: "Unregistered", weakness: "None" }, []],
        [neutralDriver, neutralTeam, [{ stat: "Unregistered", amount: 1 }]],
      ]) {
        let error;
        try { createPracticeSession(driver, team, upgrades, 5.412, () => .5); } catch (caught) { error = caught; }
        assert(error && error.message.includes("Unregistered balance"),
          "Traits and upgrade stats missing from the balance registry must fail explicitly");
      }
      const greenBalance = createBalance();
      greenBalance.discoveries.trackEvolutionMsPerLevel = 500;
      greenBalance.discoveries.tyreLifePerLevel = 1;
      greenBalance.discoveries.fuelEfficiencyPerLevel = 1;
      greenBalance.lap.pitBaseMs = 18000;
      greenBalance.vehicleStats["Pit Efficiency"].pitGainMs = 2000;
      const greenSession = createPracticeSession(neutralDriver, neutralTeam,
        [{ id: "track-evolution", level: 1 }, { id: "tyre-insight", level: 1 },
          { id: "fuel-mapping", level: 1 }, { stat: "Pit Efficiency", amount: 1 }],
        5.412, () => .5, { tyre: "Medium", fuel: 100 }, greenBalance);
      assert(greenSession.lapTarget === 94000, "Edited Track Evolution pace must affect lap generation");
      callToPit(greenSession);
      advancePracticeSession(greenSession, greenSession.lapTarget);
      assert(greenSession.tyreWear === 2 && greenSession.fuel === 99.1 && greenSession.pitRemaining === 16000,
        "Edited weekend efficiencies and pit values must affect the live simulation");
      const reliabilityBalance = createBalance();
      const reliabilityPace = (roll, points) => createPracticeSession(neutralDriver, neutralTeam,
        points ? [{ stat: "Reliability", amount: points }] : [], 5.412, () => roll,
        { tyre: "Medium", fuel: 100 }, reliabilityBalance).lapTarget;
      const unreliableFast = reliabilityPace(0, 0);
      const unreliableSlow = reliabilityPace(1, 0);
      const reliableFast = reliabilityPace(0, 1);
      const reliableSlow = reliabilityPace(1, 1);
      assert(reliableFast > unreliableFast && reliableSlow < unreliableSlow
        && reliableSlow - reliableFast < unreliableSlow - unreliableFast
        && reliabilityPace(1, 3) < reliableSlow,
      "Reliability upgrades must reduce both fast and slow lap deviations, including stronger breakthroughs");
      reliabilityBalance.vehicleStats.Reliability.variationReductionPerPoint = 1;
      assert(reliabilityPace(1, 1) < reliableSlow,
        "Edited reliability balance must change the actual lap variation");
      const weekendBalance = createBalance();
      const weekendPace = (upgrades) => createPracticeSession(neutralDriver, neutralTeam, upgrades, 5.412, () => .5,
        { tyre: "Medium", fuel: 100 }, weekendBalance).lapTarget;
      const ordinaryPace = weekendPace([]);
      assert(ordinaryPace - weekendPace([{ id: "braking-reference", level: 1 }]) === 125
        && ordinaryPace - weekendPace([{ id: "overtaking-analysis", level: 1 }]) === 100
        && ordinaryPace - weekendPace([{ id: "braking-reference", level: 2 },
          { id: "overtaking-analysis", level: 1 }]) === 350,
      "Braking and overtaking discoveries must produce their advertised stackable pace gains");
      weekendBalance.discoveries.brakingReferenceMsPerLevel = 200;
      weekendBalance.discoveries.overtakingAnalysisMsPerLevel = 80;
      assert(ordinaryPace - weekendPace([{ id: "braking-reference", level: 2 },
        { id: "overtaking-analysis", level: 1 }]) === 480,
      "Edited weekend discovery values must affect generated laps");
      const extreme = createBalance();
      extreme.lap.baseTimeMs = 1000;
      extreme.lap.baseClampMs = 0;
      extreme.modes.Attack.pace = -30000;
      const extremeSession = createPracticeSession(neutralDriver, neutralTeam, [], 5.412, () => .5,
        { tyre: "Medium", fuel: 100 }, extreme);
      setDriverMode(extremeSession, "Attack");
      setDriverMode(extremeSession, "Balanced");
      assert(extremeSession.lapTarget === extreme.lap.minimumLapMs,
        "Switching from a clamped mode must not add its entire pace penalty to the lap");
      advancePracticeSession(extremeSession, 1000);
      assert(extremeSession.lapTimes.length === 1, "Extreme edits must not cause a zero-length lap or hang");

      const actualRandom = Math.random;
      try {
        for (const [postGrandPrix, expected] of [
          [false, { blue: 4500, green: 4500, purple: 800, gold: 200 }],
          [true, { blue: 9000, green: 0, purple: 800, gold: 200 }],
        ]) {
          const counts = { blue: 0, green: 0, purple: 0, gold: 0 };
          for (let i = 0; i < 10000; i += 1) {
            let call = 0;
            Math.random = () => call++ === 0 ? i / 10000 : .5;
            counts[drawDiscovery(postGrandPrix).rarity] += 1;
          }
          assert(Object.keys(counts).every((rarity) => counts[rarity] === expected[rarity]),
            `Rarity thresholds do not match the ${postGrandPrix ? "post" : "pre"}-Grand Prix distribution`);
        }
        Math.random = () => .999999;
        const allGold = [];
        for (let i = 0; i < 3; i += 1) allGold.push(drawDiscovery(false, allGold));
        assert(new Set(allGold.map((item) => item.id)).size === 3,
          "Three gold rolls must still produce distinct cards");
      } finally {
        Math.random = actualRandom;
      }

      const game = new PitWallConsole(root);
      game.mount();
      assert(!root.querySelector('[data-action="balance-toggle"]') && !root.querySelector("#pit-wall-balance-panel"),
        "The developer balance panel must not be present without developer mode");
      const toggle = root.querySelector('[data-action="toggle-command"]');
      const commandBody = root.querySelector("#pit-wall-command-content");
      assert(toggle.getAttribute("aria-expanded") === "false" && commandBody.inert,
        "Command Centre must start collapsed");
      toggle.click();
      assert(toggle.getAttribute("aria-expanded") === "true" && !commandBody.inert,
        "Command Centre must expand");
      toggle.click();
      assert(toggle.getAttribute("aria-expanded") === "false" && commandBody.inert,
        "Command Centre must collapse again");
      root.querySelector('[data-action="new-game"]').click();

      const cards = [...root.querySelectorAll("[data-driver-index]")];
      assert(cards.length === 3, "New Game must present three drivers");
      assert(new Set(cards.map((card) => card.querySelector(".pit-wall-driver-name").textContent)).size === 3,
        "Draft candidates must be distinct");
      assert(cards.every((card) => card.querySelector(".pit-wall-driver-portrait")
        && card.querySelectorAll(".pit-wall-driver-traits").length === 2
        && card.querySelector(".pit-wall-driver-traits").textContent.split(" • ").length === 2),
      "Each candidate must have a portrait, two strengths and a weakness");

      const driverPanel = root.querySelector(".pit-wall-panel-left");
      cards[0].click();
      assert(driverPanel.textContent.includes(cards[0].querySelector(".pit-wall-driver-name").textContent)
        && cards[0].querySelector(".pit-wall-card-choice").getAttribute("aria-pressed") === "true"
        && !cards[0].querySelector(".pit-wall-confirm-button").hidden,
      "Choosing a driver must update the Driver panel and show confirmation");
      cards[1].click();
      assert(driverPanel.textContent.includes(cards[1].querySelector(".pit-wall-driver-name").textContent)
        && cards[0].querySelector(".pit-wall-card-choice").getAttribute("aria-pressed") === "false"
        && cards[0].querySelector(".pit-wall-confirm-button").hidden
        && cards[1].querySelector(".pit-wall-card-choice").getAttribute("aria-pressed") === "true"
        && !cards[1].querySelector(".pit-wall-confirm-button").hidden,
      "Choosing another driver must move the selection and confirmation");
      const selectedDriver = cards[1].querySelector(".pit-wall-driver-name").textContent;
      cards[1].querySelector(".pit-wall-confirm-button").click();
      assert(driverPanel.textContent.includes(selectedDriver) && driverPanel.textContent.includes("Driver Confirmed")
        && root.querySelector(".pit-wall-info-value").textContent === "Driver Confirmed"
        && root.querySelector("#pit-wall-draft-title").textContent === "Team Draft",
      "Confirming a driver must lock the driver and open Team Draft");
      const teamCards = [...root.querySelectorAll("[data-team-index]")];
      assert(teamCards.length === 3
        && new Set(teamCards.map((card) => card.querySelector(".pit-wall-driver-name").textContent)).size === 3
        && teamCards.every((card) => card.querySelectorAll(".pit-wall-driver-traits").length === 3),
      "Team Draft must show three distinct teams with a bonus, weakness and description");
      teamCards[0].click();
      teamCards[1].click();
      assert(teamCards[0].querySelector(".pit-wall-confirm-button").hidden
        && teamCards[0].querySelector(".pit-wall-card-choice").getAttribute("aria-pressed") === "false"
        && !teamCards[1].querySelector(".pit-wall-confirm-button").hidden
        && teamCards[1].querySelector(".pit-wall-card-choice").getAttribute("aria-pressed") === "true",
      "Changing team selection must move the confirmation");
      const selectedTeam = teamCards[1].querySelector(".pit-wall-driver-name").textContent;
      teamCards[1].querySelector(".pit-wall-confirm-button").click();
      assert(driverPanel.textContent.includes(selectedDriver) && driverPanel.textContent.includes(selectedTeam)
        && driverPanel.textContent.includes("Driver Traits") && driverPanel.textContent.includes("Team Traits")
        && driverPanel.textContent.includes("Ready For Season")
        && root.querySelector(".pit-wall-info-value").textContent === "Ready For Season"
        && root.querySelector("#pit-wall-draft-title").textContent === "2027 Season Setup"
        && !root.querySelector("[data-team-index]"),
      "Confirming a team must lock both selections and open season setup");

      const confirmSeason = root.querySelector('[data-action="confirm-season"]');
      const seasonButtons = [...root.querySelectorAll("[data-weekend]")];
      assert(seasonButtons.length === 24 && seasonButtons.every((button) => button.getAttribute("aria-pressed") === "true")
        && root.querySelector("[data-season-count]").textContent === "24 Races Selected"
        && !root.querySelector(".pit-wall-season-navigation")
        && !root.querySelector('[data-action="select-all-races"], [data-action="clear-races"]')
        && root.querySelector('[data-weekend="miami"] .pit-wall-season-date').textContent === "30 Apr-2 May"
        && root.querySelector('[data-weekend="abu-dhabi"]').getAttribute("aria-label").includes("Sprint weekend"),
      "All 24 races must be selected and visible on one calendar");
      seasonButtons.forEach((button) => button.click());
      assert(confirmSeason.disabled && root.querySelector("[data-season-count]").textContent === "0 Races Selected"
        && root.querySelector("[data-season-warning]").textContent.includes("at least one race"),
      "An empty season must not be confirmable");
      root.querySelector('[data-weekend="saudi-arabia"]').click();
      assert(root.querySelector("[data-season-count]").textContent === "1 Race Selected" && !confirmSeason.disabled,
      "Selecting one race must update the season summary");
      root.querySelector('[data-weekend="bahrain"]').click();
      assert(root.querySelector("[data-season-count]").textContent === "2 Races Selected",
        "Two races must be selectable");
      seasonButtons.filter((button) => button.getAttribute("aria-pressed") === "false").forEach((button) => button.click());
      assert(root.querySelector("[data-season-count]").textContent === "24 Races Selected",
        "Manually reselecting races must restore the full season");
      confirmSeason.click();
      assert(root.querySelector("#pit-wall-weekend-title").textContent === "Bahrain Grand Prix"
        && driverPanel.textContent.includes(selectedDriver) && driverPanel.textContent.includes(selectedTeam)
        && driverPanel.textContent.includes("Race Weekend Ready")
        && root.querySelector(".pit-wall-weekend-banner").textContent.includes("12-14 March 2027")
        && root.querySelector(".pit-wall-weekend-banner").textContent.includes("Sunny")
        && root.querySelector(".pit-wall-weekend-banner").textContent.includes("Forecast: Stable")
        && root.querySelector('[data-timing="remaining"]').textContent === "60:00"

        moving.resume();
        let lastDistance = 0;
        let wraps = 0;
        let lastPoint = path.getPointAtLength(0);
        const frames = Math.ceil(3 * lapDuration / 16) + 2;
        for (let i = 0; i <= frames; i += 1) {
          const callback = nextFrame;
          assert(callback, "Marker animation must continue scheduling frames");
          simulatedTime = i * 16;
          callback(i * 16);
          const distance = (simulatedTime % lapDuration) / lapDuration * length;
          const expected = path.getPointAtLength(distance);
          const actual = movingDriver.transform.baseVal.consolidate().matrix;
          assert(Math.hypot(actual.e - expected.x, actual.f - expected.y) < .02
            && Math.hypot(actual.e - lastPoint.x, actual.f - lastPoint.y) <= 2.6,
          "Marker frames must interpolate continuously along the approved spline");
          if (distance < lastDistance) wraps += 1;
          lastDistance = distance;
          lastPoint = expected;
        }
        assert(wraps >= 3, "The marker must complete multiple continuous laps");
        moving.remove();
        assert(nextFrame === null, "Removing the marker must cancel animation");
      } finally {
        debugWindow.requestAnimationFrame = originalRaf;
        debugWindow.cancelAnimationFrame = originalCancel;
        markerContainer.remove();
      }

      debugGame.bahrainRoute = null;
      debugGame.renderWeekend(bahrainWeekend);
      const originalFetch = window.fetch;
      try {
        window.fetch = () => Promise.reject(new Error("Test route unavailable"));
        debugRoot.querySelector('[data-action="start-session"]').click();
        for (let i = 0; i < 100 && !debugRoot.querySelector('[data-action="retry-marker"]'); i += 1) {
          await new Promise((resolve) => setTimeout(resolve, 20));
        }
        assert(debugRoot.querySelector('[role="alert"]').textContent.includes("Could not load")
          && debugRoot.querySelector('[data-action="complete-session"]').disabled,
        "Route loading failures must be visible and must not complete the session");
      } finally {
        window.fetch = originalFetch;
      }
      debugRoot.querySelector('[data-action="retry-marker"]').click();
      await waitForMarker(debugRoot);
      assert(!debugRoot.querySelector('[role="alert"]')
        && !debugRoot.querySelector('[data-action="complete-session"]').disabled,
      "Retrying a failed route load must restore the marker and completion control");
      debugRoot.querySelector('[data-action="complete-session"]').click();
      debugRoot.querySelector('[data-action="continue-review"]').click();

      for (const action of ["restart-weekend", "new-game"]) {
        debugGame.bahrainRoute = null;
        debugGame.renderWeekend(bahrainWeekend);
        const response = await originalFetch("../games/bahrain-route.json");
        let finishFetch;
        try {
          window.fetch = () => new Promise((resolve) => { finishFetch = resolve; });
          debugRoot.querySelector('[data-action="start-session"]').click();
          if (action === "new-game") debugGame.startDraft();
          else debugGame.renderWeekend(bahrainWeekend);
          finishFetch(response);
          await new Promise((resolve) => setTimeout(resolve, 50));
          assert(!debugRoot.querySelector(".pit-wall-moving-driver") && !debugGame.routeMarker,
            `A stale route load must not restore the marker after ${action}`);
        } finally {
          window.fetch = originalFetch;
        }
      }
      debugFrame.remove();
      results.textContent = "All Pit Wall regression tests passed.";
    } catch (error) {
      results.textContent = `FAILED: ${error.stack || error.message}`;
      console.error(error);
    }
  </script>
</body>
</html>
